<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Панель управления ZK Finance.">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%23000%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22Helvetica,Arial%22 font-size=%2213%22 font-weight=%22bold%22 fill=%22%23fff%22 text-anchor=%22middle%22%3EZK%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>ZK Finance — панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* ============ TOKENS — одна светлая тема, фирменная ============ */
:root{
  color-scheme:light;
  --ink:#000000;
  --ink-soft:#1F1D19;
  --ivory:#F6F0E4;
  --ivory-hi:#FBF7EE;
  --ivory-lo:#EBE3D2;
  --rule:#E1D9C7;
  --rule-strong:#CDC3AC;
  --muted:#6B6459;
  --muted-2:#8F887A;
  --on-ink:#FFFFFF;
  --on-ink-muted:#ADA79D;
  --ink-rule:#2B2B2B;
  --ink-surface:#151515;
  --ok:#3E6B4E; --ok-bg:#E4EBE2; --ok-on-ink:#8CC79C;
  --warn:#8A6A1F; --warn-bg:#F1E9D2; --warn-on-ink:#DCB765;
  --crit:#9B4030; --crit-bg:#F4E2DC; --crit-on-ink:#E8917A;
  --info:#3A5A7A; --info-bg:#E1E8EE;
  --shadow:0 1px 2px rgba(0,0,0,.03), 0 10px 30px -24px rgba(0,0,0,.4);
  --lift:0 2px 4px rgba(0,0,0,.04), 0 26px 52px -34px rgba(0,0,0,.5);
  --r-xl:34px; --r-lg:24px; --r-md:18px; --r-sm:12px; --r-pill:999px;
  --maxw:1320px;
  --ease:cubic-bezier(.22,.72,.24,1);
  --f:"Manrope","Helvetica Neue",Arial,sans-serif;
}

/* ============ BASE ============ */
*{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
body{
  margin:0;background:var(--ivory);color:var(--ink);
  font-family:var(--f);font-size:16px;line-height:1.6;font-weight:400;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
h1,h2,h3,h4,h5{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.03em;line-height:1.1}
p{margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:600;text-transform:uppercase;color:var(--muted);display:block}

/* ============ MOTION ============ */
.anim .reveal{
  opacity:0;transform:translateY(20px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);
  transition-delay:var(--d,0s);
}
.anim .reveal.in{opacity:1;transform:none}
#prog{position:fixed;top:0;left:0;height:2px;background:var(--ink);z-index:100;width:0;transition:width .1s linear}

/* ============ BUTTONS — белый текст на чёрном ============ */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;background:var(--ink);color:#FFFFFF;border:1px solid var(--ink);
  cursor:pointer;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  border-radius:var(--r-pill);white-space:nowrap;
  transition:transform .3s var(--ease),opacity .3s var(--ease),background .3s var(--ease),color .3s var(--ease);
}
.btn:hover{transform:translateY(-2px);opacity:.88}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn-ghost:hover{background:var(--ink);color:#FFFFFF;border-color:var(--ink);opacity:1}
.btn-sm{padding:10px 18px;font-size:13.5px}
.btn-lg{padding:17px 32px;font-size:15.5px}
.btn-arr{transition:transform .35s var(--ease);display:inline-block}
.btn:hover .btn-arr{transform:translateX(4px)}
.btn-white{background:#FFFFFF;color:var(--ink);border-color:#FFFFFF}
.btn-white:hover{opacity:.9}

/* ============ HEADER ============ */
.hdr{position:sticky;top:0;z-index:60;background:var(--ivory);border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.stuck{border-bottom-color:var(--rule)}
.hdr-in{display:flex;align-items:center;gap:26px;height:80px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.mark{
  width:40px;height:40px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;
  font-size:13px;font-weight:700;letter-spacing:.02em;flex:0 0 auto;border-radius:var(--r-pill);
  transition:transform .45s var(--ease);
}
.brand:hover .mark{transform:scale(1.06)}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-size:17px;font-weight:600;letter-spacing:-.02em}
.brand-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{font-size:14px;color:var(--muted);padding:8px 13px;border-radius:var(--r-pill);white-space:nowrap;transition:color .25s,background .25s;font-weight:500}
.nav a:hover{color:var(--ink);background:rgba(0,0,0,.05)}
.hdr-act{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.demo-tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;border:1px solid var(--rule-strong);color:var(--muted);padding:5px 11px;border-radius:var(--r-pill)}
.burger{display:none;width:44px;height:44px;background:none;border:1px solid var(--rule-strong);border-radius:var(--r-pill);cursor:pointer;align-items:center;justify-content:center}

/* ============ ТЕЛЕФОН В ШАПКЕ ============ */
.hdr-tel{
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--r-pill);
  border:1px solid var(--rule-strong);font-size:14px;font-weight:600;white-space:nowrap;
  transition:background .25s,color .25s,border-color .25s;
}
.hdr-tel:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.hdr-tel svg{flex:0 0 auto;opacity:.75}
.hdr-tel:hover svg{opacity:1}

/* ============ НИЖНЯЯ ПАНЕЛЬ НА ТЕЛЕФОНЕ ============ */
.mbar{display:none}
@media (max-width:780px){
  .mbar{
    display:grid;grid-template-columns:auto 1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;
    z-index:70;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(246,240,228,.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--rule);
  }
  .mbar-b{
    display:flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 20px;
    border-radius:var(--r-pill);font-size:15px;font-weight:600;
    border:1px solid var(--rule-strong);background:var(--ivory-hi);color:var(--ink);
  }
  .mbar-b.main{background:var(--ink);color:#fff;border-color:var(--ink)}
  .mbar-b:active{transform:scale(.98)}
  body{padding-bottom:84px}
  .ftr{padding-bottom:20px}
}

/* ============ АКТИВНЫЙ ПУНКТ МЕНЮ ============ */
.nav a.now{color:var(--ink);background:rgba(0,0,0,.06)}

/* ============ PILL ============ */
.pill{
  display:inline-flex;align-items:center;gap:9px;padding:8px 16px 8px 12px;
  border:1px solid var(--rule-strong);border-radius:var(--r-pill);
  font-size:13px;color:var(--muted);font-weight:500;background:var(--ivory-hi);
}
.pill svg{flex:0 0 auto;opacity:.8}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden}
#girih{position:absolute;inset:0;width:100%;height:100%;opacity:.32;pointer-events:none;will-change:transform}
.hero-in{position:relative;padding-top:76px}
.hero-grid{display:grid;grid-template-columns:1.16fr .84fr;gap:64px;align-items:end}
.hero h1{font-size:clamp(42px,5.9vw,80px);line-height:.96;letter-spacing:-.045em;margin:22px 0 0;font-weight:700}
.hero h1 em{font-style:normal;display:block;color:var(--muted-2)}
.hero-lead{margin-top:26px;font-size:18.5px;line-height:1.62;color:var(--ink-soft);max-width:47ch}
.hero-cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap;align-items:center}
.hero-trust{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;color:var(--muted);margin-top:26px}
.hero-trust b{font-weight:600;color:var(--ink)}
.hero-side{padding:8px 26px;background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-lg)}
.spec{border-top:1px solid var(--rule);padding:17px 0;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.spec:first-child{border-top:0}
.spec-k{font-size:14px;color:var(--muted)}
.spec-v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-strip{margin-top:76px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.hs{padding:24px;background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-lg);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.hs:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.hs-n{font-size:32px;font-weight:700;letter-spacing:-.04em;display:block;font-variant-numeric:tabular-nums}
.hs-l{font-size:13.5px;color:var(--muted);margin-top:8px;display:block;max-width:24ch;line-height:1.5}

/* ============ MARQUEE ============ */
.mq{overflow:hidden;padding:22px 0;margin-top:56px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.mq-in{display:flex;width:max-content;animation:mq 46s linear infinite}
.mq:hover .mq-in{animation-play-state:paused}
.mq-i{display:flex;align-items:center;gap:12px;padding:0 30px;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:500}
.mq-i::before{content:"";width:6px;height:6px;background:var(--rule-strong);border-radius:50%}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ============ SECTIONS ============ */
.sec{padding:104px 0;position:relative}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:48px;margin-bottom:52px;align-items:start}
.sec-title{font-size:clamp(30px,3.6vw,50px);line-height:1.02;letter-spacing:-.042em;font-weight:700}
.sec-desc{margin-top:20px;color:var(--muted);max-width:60ch;font-size:16.5px;line-height:1.64}
.slab{
  background:var(--ink);color:var(--on-ink);
  margin:0 14px;border-radius:var(--r-xl);
}
.slab .eyebrow{color:var(--on-ink-muted)}
.slab .sec-title{color:var(--on-ink)}
.slab .sec-desc{color:var(--on-ink-muted)}

/* ============ PROBLEM / SOLUTION ============ */
.ps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ps-col{
  background:var(--ivory-hi);border:1px solid var(--rule);
  border-radius:var(--r-xl);padding:34px 32px 36px;
}
.ps-col.acc{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ps-h{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.ps-col.acc .ps-h{border-bottom-color:var(--ink-rule)}
.ps-h h3{font-size:23px;font-weight:600}
.ps-badge{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  padding:6px 12px;margin-left:auto;border-radius:var(--r-pill);
}
.ps-badge.bad{background:var(--crit-bg);color:var(--crit)}
.ps-badge.good{background:var(--on-ink);color:var(--ink)}
.ps-i{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.55}
.ps-col.acc .ps-i{border-bottom-color:var(--ink-rule)}
.ps-i:last-child{border-bottom:0}
.ps-m{
  font-size:12px;font-weight:600;flex:0 0 22px;height:22px;border-radius:var(--r-pill);
  display:grid;place-items:center;color:var(--muted);background:var(--ivory-lo);margin-top:1px;
}
.ps-col.acc .ps-m{color:var(--ink);background:var(--on-ink)}
.ps-i b{font-weight:600;display:block;margin-bottom:3px}
.ps-i span{color:var(--muted)}
.ps-col.acc .ps-i span{color:var(--on-ink-muted)}

/* ============ CARD GRIDS ============ */
.cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cell{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-xl);
  padding:32px 28px 34px;position:relative;overflow:hidden;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease);
}
.cell:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.cell h3{font-size:23px;margin:14px 0 12px;font-weight:600}
.cell p{color:var(--muted);font-size:15px;line-height:1.62}
.cell-ar{
  font-size:30px;color:var(--rule-strong);position:absolute;right:26px;top:26px;line-height:1;
  transition:color .45s var(--ease);
}
.cell:hover .cell-ar{color:var(--muted-2)}
.cell-note{
  margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--muted);line-height:1.6;
}

/* ============ FLOW DIAGRAM ============ */
.flow{
  border:1px solid var(--rule);background:var(--ivory-hi);border-radius:var(--r-xl);
  padding:38px 32px;margin-bottom:14px;
}
.flow-row{display:grid;grid-template-columns:1fr 58px 1fr 58px 1fr;align-items:center}
.fnode{
  border:1px solid var(--rule-strong);background:var(--ivory);padding:22px;text-align:center;
  border-radius:var(--r-lg);transition:border-color .4s var(--ease),transform .4s var(--ease);
}
.fnode.on{border-color:var(--ink);transform:translateY(-3px)}
.fnode.mid{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.fnode-t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fnode.mid .fnode-t{color:var(--on-ink-muted)}
.fnode-n{font-size:20px;margin-top:8px;display:block;font-weight:600;letter-spacing:-.02em}
.farr{position:relative;height:1px;background:var(--rule-strong)}
.farr::after{
  content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;
  border-top:1px solid var(--rule-strong);border-right:1px solid var(--rule-strong);transform:rotate(45deg);
}
.farr i{
  position:absolute;left:0;top:0;height:1px;background:var(--ink);width:100%;
  transition:width .8s var(--ease);transition-delay:var(--d,0s);
}
.anim .farr i{width:0}
.anim .farr.in i{width:100%}
.flow-lbl{
  display:grid;grid-template-columns:1fr 58px 1fr 58px 1fr;margin-top:16px;
  font-size:12.5px;color:var(--muted);text-align:center;
}
.flow-lbl span:nth-child(even){font-size:11px;color:var(--muted-2)}

/* ============ STEPS ============ */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{
  background:var(--ink);color:var(--on-ink);border-radius:var(--r-xl);
  padding:30px 26px 32px;display:flex;flex-direction:column;gap:13px;
  transition:transform .45s var(--ease);
}
.step:hover{transform:translateY(-4px)}
.step-n{
  font-size:11.5px;letter-spacing:.14em;color:var(--on-ink-muted);font-weight:600;
  display:flex;align-items:center;gap:10px;
}
.step-n::after{content:"";flex:1;height:1px;background:var(--ink-rule)}
.step h4{font-size:19px;font-weight:600;color:var(--on-ink)}
.step p{font-size:14.5px;color:var(--on-ink-muted);line-height:1.6}
.step-tag{
  margin-top:auto;padding-top:16px;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--on-ink);opacity:.55;font-weight:600;
}

/* ============ CALCULATOR ============ */
.calc{display:grid;grid-template-columns:.92fr 1.08fr;gap:14px}
.calc-in{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-xl);
  padding:34px 32px;display:flex;flex-direction:column;
}
.calc-out{
  background:var(--ink);color:var(--on-ink);border-radius:var(--r-xl);
  padding:34px 32px;display:flex;flex-direction:column;
}
.calc-out .eyebrow{color:var(--on-ink-muted)}
.fld{margin-bottom:28px}
.fld:last-child{margin-bottom:0}
.fld-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.fld-l{font-size:14px;color:var(--muted)}
.fld-v{font-size:18px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:pointer;display:block}
input[type="range"]::-webkit-slider-runnable-track{height:4px;background:var(--ivory-lo);border-radius:var(--r-pill)}
input[type="range"]::-moz-range-track{height:4px;background:var(--ivory-lo);border-radius:var(--r-pill)}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;background:var(--ink);margin-top:-8px;
  border:3px solid var(--ivory-hi);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.25);
  transition:transform .2s var(--ease);
}
input[type="range"]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type="range"]::-moz-range-thumb{
  width:20px;height:20px;background:var(--ink);border:3px solid var(--ivory-hi);border-radius:50%;
}
.fld-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-2);margin-top:4px}
.seg{display:flex;gap:6px;background:var(--ivory-lo);padding:5px;border-radius:var(--r-pill)}
.seg button{
  flex:1;padding:11px 6px;background:transparent;border:0;cursor:pointer;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);
  border-radius:var(--r-pill);transition:color .3s var(--ease),background .3s var(--ease);
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.seg-2 button{font-size:13.5px}

/* — stages of the calculation — */
.stages{display:flex;flex-direction:column;position:relative;padding-left:36px}
.stages::before{content:"";position:absolute;left:11px;top:16px;bottom:46px;width:1px;background:var(--ink-rule)}
.stg{position:relative;padding:13px 0;display:flex;align-items:baseline;gap:14px}
.stg[data-n]::before{
  content:attr(data-n);position:absolute;left:-36px;top:12px;
  width:23px;height:23px;border:1px solid var(--ink-rule);background:var(--ink);
  font-size:10.5px;font-weight:600;display:grid;place-items:center;color:var(--on-ink-muted);
  border-radius:var(--r-pill);
  transition:background .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease);
}
.stg.hot::before{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
.stg-l{font-size:14.5px;color:var(--on-ink);flex:1;opacity:.92}
.stg-l small{display:block;color:var(--on-ink-muted);font-size:12.5px;margin-top:3px;opacity:1}
.stg-v{font-size:16.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.stg-op{
  font-size:15px;color:var(--on-ink-muted);position:absolute;left:-36px;top:14px;
  width:23px;text-align:center;
}
.stg.sum{border-top:1px solid var(--ink-rule);margin-top:8px;padding-top:18px}
.stg.sum .stg-l{opacity:1;font-weight:600}
.stg.sum .stg-v{font-size:20px}
.res-main{
  background:var(--on-ink);color:var(--ink);border-radius:var(--r-lg);
  padding:24px 26px;margin-top:26px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
}
.res-lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.res-big{font-size:clamp(34px,4.2vw,48px);line-height:1;margin-top:10px;font-weight:700;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.res-side{text-align:right;flex:0 0 auto}
.res-side b{font-size:17px;display:block;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.res-side span{font-size:12.5px;color:var(--muted)}
.prop{margin-top:24px}
.prop-bar{display:flex;height:36px;border-radius:var(--r-pill);overflow:hidden;background:var(--ivory-lo);gap:2px}
.prop-bar i{display:block;height:100%;transition:width .55s var(--ease)}
.prop-down{background:var(--rule-strong)}
.prop-fin{background:var(--ink)}
.prop-mark{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 7px);border:1px solid var(--ink)}
.prop-leg{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.pl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.pl i{width:12px;height:12px;flex:0 0 auto;border-radius:4px}
.bankcmp{
  margin-top:22px;border:1px solid var(--ink-rule);border-radius:var(--r-lg);padding:18px 22px;
  display:flex;align-items:center;gap:16px;
}
.bankcmp-t{font-size:13.5px;color:var(--on-ink-muted);line-height:1.55;flex:1}
.bankcmp-t b{color:var(--on-ink);font-weight:600}
.bankcmp-v{font-size:21px;color:var(--crit-on-ink);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;letter-spacing:-.02em}
.res-note{margin-top:auto;padding-top:22px;font-size:12.5px;color:var(--on-ink-muted);line-height:1.6}
.mini-sched{margin-top:24px}
.mini-sched-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.msc{display:flex;align-items:flex-end;gap:4px;height:56px}
.msc i{flex:1;background:var(--ink-rule);display:block;border-radius:3px;transition:height .5s var(--ease),background .3s}
.msc i:hover{background:var(--on-ink)}
.calc-help{margin-top:auto;padding-top:28px}
.calc-help .eyebrow{margin-bottom:14px}
.ch-i{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:13.5px;color:var(--muted);line-height:1.5}
.ch-i:last-child{border-bottom:0}
.ch-i b{
  font-size:10.5px;color:var(--muted);flex:0 0 20px;height:20px;border-radius:var(--r-pill);
  background:var(--ivory-lo);display:grid;place-items:center;font-weight:600;margin-top:1px;
}

/* ============ COMPARISON ============ */
.cmp{border:1px solid var(--ink-rule);border-radius:var(--r-lg);overflow:hidden}
.cmp-row{display:grid;grid-template-columns:1.05fr 1fr 1fr;border-bottom:1px solid var(--ink-rule)}
.cmp-row:last-child{border-bottom:0}
.cmp-row>div{padding:20px 24px;font-size:15px;line-height:1.5}
.cmp-head>div{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-ink-muted);font-weight:600}
.cmp-head .cmp-us{color:var(--on-ink)}
.cmp-k{color:var(--on-ink-muted)}
.cmp-bad{color:var(--on-ink-muted)}
.cmp-us{background:rgba(255,255,255,.06);position:relative;font-weight:500}
.cmp-us::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--on-ink);
  transform-origin:top;transition:transform .6s var(--ease);transition-delay:var(--d,0s);
}
.anim .cmp-us::before{transform:scaleY(0)}
.anim .cmp-row.in .cmp-us::before{transform:scaleY(1)}

/* ============ PRODUCTS ============ */
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.prod{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-xl);
  padding:32px 30px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease);
}
.prod:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.prod-ill{
  position:absolute;right:-10px;top:-6px;width:148px;height:148px;opacity:.12;pointer-events:none;
  transition:opacity .5s var(--ease),transform .6s var(--ease);
}
.prod:hover .prod-ill{opacity:.2;transform:translate(-6px,4px) rotate(-3deg)}
.prod-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;position:relative}
.prod h3{font-size:27px;font-weight:600;letter-spacing:-.035em}
.prod-sub{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-weight:600}
.prod p{color:var(--muted);font-size:15px;line-height:1.62;position:relative;max-width:42ch}
.prod-meta{display:flex;gap:26px;border-top:1px solid var(--rule);padding-top:18px;margin-top:auto;position:relative}
.pm-k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;font-weight:600}
.pm-v{font-size:17px;font-variant-numeric:tabular-nums;margin-top:5px;display:block;font-weight:600;letter-spacing:-.02em}
.prod-go{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);position:relative;font-weight:600}
.prod-go svg{transition:transform .35s var(--ease)}
.prod:hover .prod-go svg{transform:translateX(5px)}
.tag{
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  border:1px solid var(--rule-strong);padding:6px 12px;color:var(--muted);
  white-space:nowrap;border-radius:var(--r-pill);
}

/* ============ CASES ============ */
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.case{
  background:rgba(255,255,255,.055);border:1px solid var(--ink-rule);border-radius:var(--r-xl);
  padding:30px 28px;display:flex;flex-direction:column;gap:18px;transition:transform .4s var(--ease);
}
.case:hover{transform:translateY(-4px)}
.case-q{font-size:19px;line-height:1.42;color:var(--on-ink);font-weight:500;letter-spacing:-.02em}
.case-m{display:flex;gap:24px;padding:16px 0;border-top:1px solid var(--ink-rule);border-bottom:1px solid var(--ink-rule)}
.case-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-ink-muted);display:block;font-weight:600}
.case-v{font-size:16px;color:var(--on-ink);margin-top:5px;display:block;font-variant-numeric:tabular-nums;font-weight:600}
.case-who{display:flex;align-items:center;gap:12px;margin-top:auto}
.case-av{
  width:40px;height:40px;border:1px solid var(--ink-rule);border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:12.5px;color:var(--on-ink-muted);flex:0 0 auto;font-weight:600;
}
.case-n{font-size:14.5px;color:var(--on-ink);display:block;font-weight:500}
.case-c{font-size:12.5px;color:var(--on-ink-muted);display:block}

/* ============ DOCUMENTS ============ */
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.doc{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:26px 28px;display:flex;align-items:flex-start;gap:16px;
  transition:transform .4s var(--ease),box-shadow .4s var(--ease);
}
.doc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.doc-ic{
  width:38px;height:38px;background:var(--ink);color:var(--on-ink);flex:0 0 auto;
  display:grid;place-items:center;font-size:12px;border-radius:var(--r-pill);font-weight:600;
}
.doc h4{font-size:16px;font-weight:600}
.doc p{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.55}

/* ============ COUNCIL ============ */
.council{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cm{
  background:rgba(255,255,255,.055);border:1px solid var(--ink-rule);border-radius:var(--r-xl);
  padding:30px 28px;transition:transform .4s var(--ease);
}
.cm:hover{transform:translateY(-4px)}
.cm-av{
  width:48px;height:48px;border:1px solid var(--ink-rule);border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:13px;color:var(--on-ink-muted);margin-bottom:18px;font-weight:600;
}
.cm h4{font-size:18px;font-weight:600;color:var(--on-ink)}
.cm-role{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-ink-muted);margin-top:8px;font-weight:600}
.cm p{font-size:14.5px;color:var(--on-ink-muted);margin-top:16px;line-height:1.6}

/* ============ WIZARD ============ */
.wizard{border:1px solid var(--rule);background:var(--ivory-hi);border-radius:var(--r-xl);overflow:hidden}
.wz-head{display:flex;border-bottom:1px solid var(--rule);padding:10px;gap:8px}
.wz-t{flex:1;padding:14px 20px;display:flex;align-items:center;gap:12px;border-radius:var(--r-pill);transition:background .35s var(--ease)}
.wz-t.on{background:var(--ivory-lo)}
.wz-n{
  width:26px;height:26px;border:1px solid var(--rule-strong);border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:11.5px;color:var(--muted);flex:0 0 auto;font-weight:600;
  transition:background .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease);
}
.wz-t.on .wz-n{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.wz-t.done .wz-n{background:var(--ok);color:var(--ivory);border-color:var(--ok)}
.wz-l{font-size:14px;color:var(--muted)}
.wz-t.on .wz-l{color:var(--ink);font-weight:600}
.wz-body{padding:34px;position:relative;overflow:hidden}
.wz-pane{display:none}
.wz-pane.on{display:block;animation:paneIn .45s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.f-full{grid-column:1/-1}
label.lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:600}
.inp{
  width:100%;padding:14px 17px;background:var(--ivory);border:1px solid var(--rule-strong);
  border-radius:var(--r-md);font-size:15px;transition:border-color .25s,background .25s;
}
.inp:focus{outline:none;border-color:var(--ink);background:var(--ivory-hi)}
.inp.err{border-color:var(--crit);background:var(--crit-bg)}
select.inp{
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;
  background-size:5px 5px;background-repeat:no-repeat;
}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick button{
  background:var(--ivory);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:20px 18px;cursor:pointer;text-align:left;transition:all .3s var(--ease);
}
.pick button:hover{border-color:var(--rule-strong);transform:translateY(-2px)}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pick-t{font-size:15px;font-weight:600;display:block}
.pick-s{font-size:12.5px;color:var(--muted);display:block;margin-top:5px}
.pick button[aria-pressed="true"] .pick-s{color:var(--on-ink-muted)}
.wz-foot{display:flex;align-items:center;gap:14px;margin-top:30px;padding-top:24px;border-top:1px solid var(--rule);flex-wrap:wrap}
.wz-foot p{font-size:12.5px;color:var(--muted);max-width:46ch;line-height:1.55}
.wz-sum{
  display:flex;gap:26px;padding:18px 22px;background:var(--ivory);border:1px solid var(--rule);
  border-radius:var(--r-lg);margin-bottom:26px;flex-wrap:wrap;
}
.wz-sum span{display:block}
.wz-sum .pm-v{font-size:16px}
.done-box{text-align:center;padding:30px 20px}
.done-ic{
  width:66px;height:66px;background:var(--ok);color:var(--ivory);border-radius:var(--r-pill);margin:0 auto 22px;
  display:grid;place-items:center;font-size:28px;animation:pop .5s var(--ease);
}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.done-box h3{font-size:29px;margin-bottom:12px;font-weight:600}
.done-box p{color:var(--muted);max-width:48ch;margin:0 auto;font-size:15px}
.done-id{
  font-size:15px;border:1px solid var(--rule-strong);border-radius:var(--r-pill);
  padding:11px 22px;display:inline-block;margin-top:22px;font-weight:600;font-variant-numeric:tabular-nums;
}

/* ============ FAQ ============ */
.faq{display:flex;flex-direction:column;gap:10px}
.q{border:1px solid var(--rule);background:var(--ivory-hi);border-radius:var(--r-lg);transition:border-color .3s}
.q[open-state="1"]{border-color:var(--rule-strong)}
.q-btn{
  width:100%;background:none;border:0;padding:24px 26px;text-align:left;cursor:pointer;
  display:flex;justify-content:space-between;gap:26px;align-items:center;font-size:17px;
  font-weight:600;letter-spacing:-.02em;transition:color .25s;
}
.q-btn:hover{color:var(--muted)}
.q-mark{
  font-size:18px;color:var(--muted);flex:0 0 30px;height:30px;border-radius:var(--r-pill);
  background:var(--ivory-lo);display:grid;place-items:center;transition:transform .35s var(--ease);
}
.q[open-state="1"] .q-mark{transform:rotate(135deg)}
.q-body{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.q-body p{padding:0 26px 26px;color:var(--muted);max-width:74ch;font-size:15px;line-height:1.68}

/* ============ CTA ============ */
.cta{background:var(--ink);color:var(--on-ink);padding:80px 0;margin:0 14px;border-radius:var(--r-xl)}
.cta-in{display:flex;align-items:center;gap:48px;flex-wrap:wrap}
.cta h2{font-size:clamp(30px,3.9vw,50px);line-height:1.03;color:var(--on-ink);flex:1;min-width:280px;letter-spacing:-.042em;font-weight:700}
.cta-side{display:flex;flex-direction:column;gap:14px}
.cta .btn{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink)}
.cta-phone{font-size:24px;color:var(--on-ink);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cta-hours{font-size:13px;color:var(--on-ink-muted)}

/* ============ FOOTER ============ */
.ftr{padding:70px 0 34px}
.ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:44px}
.ftr h5{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;font-weight:600}
.ftr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.ftr a{font-size:14.5px;color:var(--ink);opacity:.7;transition:opacity .25s}
.ftr a:hover{opacity:1}
.ftr-bot{margin-top:56px;padding-top:26px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ftr-note{margin-top:18px;font-size:14px;color:var(--muted);max-width:38ch;line-height:1.62}
.ftr-office{font-size:14px;color:var(--muted);line-height:1.7}
.ftr-office b{color:var(--ink);font-weight:600;display:block;margin-top:12px}

/* ============ GATE ============ */
.gate{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:24px}
.gate-card{
  width:100%;max-width:440px;background:var(--ivory);padding:40px 36px;
  border-radius:var(--r-xl);border:1px solid var(--rule);
}
.gate .mark{width:46px;height:46px;font-size:15px}
.gate h2{font-size:29px;margin:24px 0 10px;font-weight:600;letter-spacing:-.035em}
.gate p{color:var(--muted);font-size:14.5px;line-height:1.6}
.gate-users{display:flex;flex-direction:column;gap:8px;margin:26px 0 22px}
.gate-hint{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:52px}
.pw-eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border:0;background:none;cursor:pointer;color:var(--muted);
  border-radius:var(--r-pill);display:grid;place-items:center;transition:color .2s,background .2s;
}
.pw-eye:hover{color:var(--ink);background:var(--ivory-lo)}
.pw-eye.on{color:var(--ink)}
.pw-eye.on svg{opacity:1}
.pw-eye svg{opacity:.7}
.gu{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:14px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;text-align:left;
  width:100%;transition:border-color .25s,background .25s;
}
.gu:hover{border-color:var(--rule-strong)}
.gu[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.gu-av{
  width:36px;height:36px;background:var(--ink);color:var(--on-ink);border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:12px;flex:0 0 auto;font-weight:600;
}
.gu[aria-pressed="true"] .gu-av{background:var(--on-ink);color:var(--ink)}
.gu-n{font-size:14.5px;font-weight:600;display:block}
.gu-r{font-size:12.5px;color:var(--muted);display:block}
.gu[aria-pressed="true"] .gu-r{color:var(--on-ink-muted)}
.gu-chk{margin-left:auto;font-size:14px;opacity:0}
.gu[aria-pressed="true"] .gu-chk{opacity:1}

/* ============ HUB SHELL ============ */
.hub{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:var(--ivory)}
.rail{
  background:var(--ink);color:var(--on-ink);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;margin:10px 0 10px 10px;
  border-radius:var(--r-lg);height:calc(100vh - 20px);
}
.rail-top{padding:20px 18px;border-bottom:1px solid var(--ink-rule);display:flex;align-items:center;gap:11px}
.rail .mark{background:var(--on-ink);color:var(--ink);width:34px;height:34px;font-size:12px}
.rail-name{font-size:16px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.rail-sub{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-ink-muted);font-weight:600}
.rail-nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.rail-sec{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--on-ink-muted);padding:16px 12px 7px;font-weight:600}
.rl{
  display:flex;align-items:center;gap:12px;padding:11px 12px;background:none;border:0;
  cursor:pointer;color:var(--on-ink);opacity:.66;font-size:14px;text-align:left;width:100%;
  border-radius:var(--r-md);transition:opacity .2s,background .2s;font-weight:500;
}
.rl:hover{opacity:1;background:rgba(255,255,255,.07)}
.rl.on{opacity:1;background:rgba(255,255,255,.13)}
.rl-ic{width:16px;height:16px;flex:0 0 auto}
.rl-badge{
  margin-left:auto;font-size:11px;background:var(--on-ink);color:var(--ink);
  padding:2px 8px;border-radius:var(--r-pill);font-variant-numeric:tabular-nums;font-weight:600;
}
.rail-bot{padding:14px 18px;border-top:1px solid var(--ink-rule);display:flex;align-items:center;gap:11px}
.rail-bot .gu-av{background:var(--on-ink);color:var(--ink);width:32px;height:32px;font-size:11px}
.rail-bot .gu-n{color:var(--on-ink);font-size:13.5px}
.rail-bot .gu-r{color:var(--on-ink-muted);font-size:11.5px}
.rail-exit{
  margin-left:auto;background:none;border:1px solid var(--ink-rule);color:var(--on-ink);
  cursor:pointer;padding:6px 10px;font-size:12px;border-radius:var(--r-pill);
}
.rail-exit:hover{background:var(--on-ink);color:var(--ink)}

.hub-main{display:flex;flex-direction:column;min-width:0}
.topbar{
  background:var(--ivory);padding:0 26px;height:74px;display:flex;align-items:center;gap:18px;
  position:sticky;top:0;z-index:40;
}
.tb-title{font-size:22px;font-weight:600;letter-spacing:-.03em}
.tb-crumb{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tb-search{margin-left:auto;position:relative;width:270px}
.tb-search .inp{padding:10px 14px 10px 36px;font-size:14px;background:var(--ivory-hi);border-radius:var(--r-pill)}
.tb-search svg{position:absolute;left:14px;top:12px;opacity:.45}
.tb-date{
  font-size:12.5px;color:var(--muted);border:1px solid var(--rule-strong);
  padding:8px 14px;white-space:nowrap;border-radius:var(--r-pill);font-weight:500;
}
.hub-body{padding:8px 26px 26px;display:flex;flex-direction:column;gap:14px;flex:1}

/* ============ HUB PRIMITIVES ============ */
.card{background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden}
.card-h{padding:17px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px}
.card-h h3{font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.card-h .eyebrow{margin-left:auto}
.card-b{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-lg);
  padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease);
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-l{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi-v{font-size:27px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.04em;font-weight:700}
.kpi-v small{font-size:15px;margin-left:2px;font-weight:600}
.kpi-f{display:flex;align-items:center;gap:8px;margin-top:auto}
.delta{font-size:11px;padding:3px 9px;border-radius:var(--r-pill);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.delta.up{background:var(--ok-bg);color:var(--ok)}
.delta.down{background:var(--crit-bg);color:var(--crit)}
.delta.flat{background:var(--ivory-lo);color:var(--muted)}
.kpi-sub{font-size:11.5px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.chart-wrap{position:relative;width:100%}
canvas.chart{display:block;width:100%}

.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 11px;white-space:nowrap;border-radius:var(--r-pill);font-weight:600;
}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neut{background:var(--ivory-lo);color:var(--muted)}

.tbl-scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:660px}
.tbl th{
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:13px 16px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap;
}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover{background:var(--ivory-lo)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .n{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500}
.tbl .id{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.av{
  width:32px;height:32px;background:var(--ivory-lo);border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:11px;flex:0 0 auto;color:var(--muted);font-weight:600;
}
.who-n{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-s{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.bar{height:6px;background:var(--ivory-lo);position:relative;min-width:60px;overflow:hidden;border-radius:var(--r-pill)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);display:block;border-radius:var(--r-pill)}

/* ============ KANBAN ============ */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(215px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--ivory-lo);border-radius:var(--r-lg);min-height:200px;display:flex;flex-direction:column}
.col-h{padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
.col-t{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.col-c{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.col-sum{padding:0 16px 12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px;flex:1}
.col.drop{outline:2px dashed var(--rule-strong);outline-offset:-4px}
.kc{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-md);padding:14px;
  cursor:grab;display:flex;flex-direction:column;gap:10px;
  transition:box-shadow .2s,border-color .2s,transform .2s;
}
.kc:hover{box-shadow:var(--shadow);border-color:var(--rule-strong);transform:translateY(-2px)}
.kc:active{cursor:grabbing}
.kc.drag{opacity:.4}
.kc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kc-id{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.kc .chip{font-size:9.5px;padding:3px 8px;letter-spacing:.02em}
.kc-n{font-size:14.5px;font-weight:600;line-height:1.3}
.kc-p{font-size:12.5px;color:var(--muted)}
.kc-sum{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.kc-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--rule);padding-top:10px}
.kc-days{margin-left:auto;font-size:11px;color:var(--muted)}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;opacity:0;transition:opacity .22s}
.scrim.on{opacity:1}
.drawer{
  position:fixed;top:10px;right:10px;bottom:10px;width:min(580px,calc(100% - 20px));
  background:var(--ivory);z-index:91;border-radius:var(--r-xl);display:flex;flex-direction:column;
  transform:translateX(calc(100% + 20px));transition:transform .3s var(--ease);overflow:hidden;
}
.drawer.on{transform:none}
.dr-h{padding:24px 26px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:14px}
.dr-h h3{font-size:25px;line-height:1.15;font-weight:600;letter-spacing:-.035em}
.dr-x{
  background:var(--ivory-lo);border:0;cursor:pointer;width:36px;height:36px;flex:0 0 auto;
  margin-left:auto;font-size:15px;border-radius:var(--r-pill);transition:background .25s;
}
.dr-x:hover{background:var(--ink);color:var(--on-ink)}
.dr-b{padding:24px 26px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:24px}
.dr-sec-t{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px}
.kv-k{font-size:11.5px;color:var(--muted);display:block}
.kv-v{font-size:14.5px;font-variant-numeric:tabular-nums;margin-top:4px;display:block;font-weight:600}
.chk{display:flex;flex-direction:column;gap:8px}
.chk-i{
  background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;
}
.chk-b{
  width:20px;height:20px;border:1px solid var(--rule-strong);border-radius:var(--r-pill);
  display:grid;place-items:center;font-size:11px;flex:0 0 auto;
}
.chk-i.yes .chk-b{background:var(--ok);border-color:var(--ok);color:var(--ivory)}
.chk-i.no .chk-b{border-color:var(--crit);color:var(--crit)}
.chk-note{margin-left:auto;font-size:12px;color:var(--muted)}
.dr-f{padding:18px 26px;border-top:1px solid var(--rule);display:flex;gap:10px;background:var(--ivory-hi)}
.dr-f .btn{flex:1}
.btn-out{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn-out:hover{background:var(--crit);border-color:var(--crit);color:var(--ivory)}
.sched{width:100%;border-collapse:collapse;font-size:13px}
.sched th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);font-weight:600}
.sched td{padding:10px 12px;border-bottom:1px solid var(--rule)}
.sched .n{font-variant-numeric:tabular-nums;text-align:right}
.sched tr.paid td{color:var(--muted)}

/* ============ MISC HUB ============ */
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.filt{
  background:var(--ivory-hi);border:1px solid var(--rule);padding:8px 15px;cursor:pointer;
  font-size:12.5px;color:var(--muted);border-radius:var(--r-pill);font-weight:500;
  transition:all .25s var(--ease);
}
.filt:hover{color:var(--ink);border-color:var(--rule-strong)}
.filt.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--rule)}
.fi:last-child{border-bottom:0}
.fi-t{font-size:11px;color:var(--muted);flex:0 0 44px;padding-top:2px;font-variant-numeric:tabular-nums}
.fi-txt{font-size:14px;line-height:1.5}
.fi-txt b{font-weight:600}
.fi-txt span{color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:10px}
.fn{display:grid;grid-template-columns:132px 1fr 54px;gap:12px;align-items:center;font-size:13.5px}
.fn-bar{height:24px;background:var(--ivory-lo);position:relative;border-radius:var(--r-pill);overflow:hidden}
.fn-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:var(--r-pill)}
.fn-n{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.split{display:flex;flex-direction:column;gap:12px}
.sp{display:grid;grid-template-columns:1fr 60px;gap:12px;align-items:center;font-size:14px}
.sp-bar{grid-column:1/-1;height:6px;background:var(--ivory-lo);position:relative;margin-top:-4px;border-radius:var(--r-pill)}
.sp-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:var(--r-pill)}
.sp-v{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14px}
.setrow{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid var(--rule)}
.setrow:last-child{border-bottom:0}
.setrow-t{font-size:14.5px;font-weight:600}
.setrow-d{font-size:12.5px;color:var(--muted);margin-top:3px}
.setrow-c{margin-left:auto;display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;background:var(--ivory-lo);border-radius:var(--r-pill);padding:4px}
.stepper button{
  background:none;border:0;width:30px;height:30px;cursor:pointer;font-size:16px;
  border-radius:var(--r-pill);transition:background .2s;
}
.stepper button:hover{background:var(--ink);color:var(--on-ink)}
.stepper span{padding:0 12px;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:66px;text-align:center;font-weight:600}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);z-index:120;
  background:var(--ink);color:var(--on-ink);padding:14px 24px;font-size:14.5px;
  border-radius:var(--r-pill);display:flex;align-items:center;gap:11px;opacity:0;
  transition:transform .26s var(--ease),opacity .26s;font-weight:500;
}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ============ RESPONSIVE ============ */
@media (max-width:1340px){
  .demo-tag{display:none}
  .hdr-tel span{display:none}
  .hdr-tel{padding:9px 12px}
  .nav{gap:2px}
  .nav a{font-size:13.5px;padding:8px 11px}
}
@media (max-width:1140px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid-2,.grid-2b{grid-template-columns:1fr}
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .sec-head{grid-template-columns:1fr;gap:14px}
  .steps{grid-template-columns:repeat(2,1fr)}
  .ftr-grid{grid-template-columns:1fr 1fr}
  .calc{grid-template-columns:1fr}
  .cases{grid-template-columns:1fr}
  .council{grid-template-columns:1fr}
  .hero-strip{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .hub{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;z-index:80;width:250px;margin:0;height:100vh;border-radius:0;transform:translateX(-100%);transition:transform .3s var(--ease)}
  .rail.open{transform:none}
  .hub-menu{display:inline-flex !important}
  .flow-row,.flow-lbl{grid-template-columns:1fr}
  .farr{height:26px;width:1px;justify-self:center;background:var(--rule-strong)}
  .farr::after{right:-3px;top:auto;bottom:0;transform:rotate(135deg)}
  .farr i{width:1px;height:100%;transition:height .8s var(--ease)}
  .anim .farr i{width:1px;height:0}
  .anim .farr.in i{height:100%}
  .flow-lbl{display:none}
  .ps{grid-template-columns:1fr}
  .prods{grid-template-columns:1fr}
  .docs{grid-template-columns:1fr}
  .pick{grid-template-columns:1fr 1fr}
}
@media (max-width:780px){
  .wrap{padding:0 18px}
  .nav{display:none}
  .burger{display:inline-flex;margin-left:auto}
  .hdr-act .btn,.hdr-tel{display:none}
  .hdr-in{gap:12px;height:70px}
  .nav.open{
    display:flex;position:absolute;top:70px;left:12px;right:12px;background:var(--ivory-hi);
    flex-direction:column;gap:2px;padding:12px;border:1px solid var(--rule);
    border-radius:var(--r-lg);animation:paneIn .3s var(--ease);box-shadow:var(--lift);
  }
  .nav.open a{padding:14px 16px;font-size:16px;color:var(--ink)}
  #girih{opacity:.28}
  .hero-in{padding-top:44px}
  .hero-strip{grid-template-columns:1fr;margin-top:48px}
  .hs-n{font-size:27px}
  .sec{padding:62px 0}
  .slab,.cta{margin:0 10px;border-radius:var(--r-lg)}
  .cols-3,.steps,.pick{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .cmp-row{grid-template-columns:1fr}
  .cmp-row>div{padding:14px 20px}
  .cmp-head{display:none}
  .cmp-k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding-bottom:0 !important}
  .kpis{grid-template-columns:1fr 1fr}
  .ftr-grid{grid-template-columns:1fr;gap:32px}
  .tb-search{display:none}
  .hub-body{padding:8px 14px 16px}
  .topbar{padding:0 14px;height:64px}
  .calc-in,.calc-out{padding:26px 22px}
  .wz-body{padding:24px 18px}
  .wz-l{display:none}
  .wz-t{flex:0 0 auto;padding:12px 16px}
  .res-main{flex-direction:column;align-items:flex-start;gap:14px}
  .res-side{text-align:left}
  .cta-in{gap:26px}
  .ps-col{padding:26px 22px 30px}
  .prod-top{flex-wrap:wrap;gap:10px}
  .tag{white-space:normal}
  .prod-meta{gap:18px;flex-wrap:wrap}
  .drawer{top:0;right:0;bottom:0;width:100%;border-radius:0}
  .q-btn{padding:20px 20px;font-size:16px}
  .q-body p{padding:0 20px 22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;animation-iteration-count:1 !important}
  .anim .reveal{opacity:1;transform:none}
  .mq-in{animation:none}
}

/* ============ ПЕРЕКЛЮЧАТЕЛЬ ============ */
.swi{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:14.5px;user-select:none}
.swi input{position:absolute;opacity:0;pointer-events:none}
.swi-b{
  width:42px;height:24px;border-radius:var(--r-pill);background:var(--ivory-lo);
  border:1px solid var(--rule-strong);position:relative;flex:0 0 auto;transition:background .25s,border-color .25s;
}
.swi-b::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--ink);transition:transform .25s var(--ease);
}
.swi input:checked+.swi-b{background:var(--ink);border-color:var(--ink)}
.swi input:checked+.swi-b::after{transform:translateX(18px);background:#fff}
.swi input:disabled+.swi-b{opacity:.45}
.swi input:focus-visible+.swi-b{outline:2px solid var(--ink);outline-offset:3px}

/* ============ СПИСОК ДЕЛ НА ДАШБОРДЕ ============ */
.todo-g{border-bottom:1px solid var(--rule)}
.todo-g:last-child{border-bottom:0}
.todo-h{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.todo-n{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.todo-i{
  display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;
  transition:background .15s;border-top:1px solid var(--rule);
}
.todo-i:hover{background:var(--ivory-lo)}
.todo-t{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.todo-t b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-a{margin-left:auto;flex:0 0 auto}
.tel{
  display:inline-block;font-size:13px;font-weight:600;color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:var(--r-pill);padding:6px 14px;
  white-space:nowrap;transition:background .2s,color .2s;
}
.tel:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.dr-b .tel{margin-top:2px}

/* ============ ЗАМЕТКИ ============ */
.notes{display:flex;flex-direction:column;gap:8px}
.note-i{background:var(--ivory-hi);border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px}
.note-m{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.note-t{font-size:14px;line-height:1.5;white-space:pre-wrap}
.note-add{display:flex;gap:8px;margin-top:10px}
.note-add textarea{
  flex:1;min-height:44px;max-height:140px;padding:11px 14px;background:var(--ivory);
  border:1px solid var(--rule-strong);border-radius:var(--r-md);font-size:14px;resize:vertical;
}
.note-add textarea:focus{outline:none;border-color:var(--ink)}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
th.sortable .arw{opacity:.35;margin-left:4px}
th.sortable.on .arw{opacity:1}

/* ============ БЫСТРЫЕ ДЕЙСТВИЯ И ПОИСК ============ */
.rail-act{padding:12px 12px 0}
.rail-search{
  width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;
  background:rgba(255,255,255,.08);border:1px solid var(--ink-rule);color:var(--on-ink);
  border-radius:var(--r-md);font-size:13.5px;opacity:.8;transition:opacity .2s,background .2s;
}
.rail-search:hover{opacity:1;background:rgba(255,255,255,.14)}
.rail-search kbd{
  margin-left:auto;font:inherit;font-size:11px;opacity:.55;border:1px solid var(--ink-rule);
  border-radius:6px;padding:1px 5px;
}
.rl-badge.warn{background:var(--crit-on-ink);color:#fff}
.find{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:12vh 20px 20px}
.find-box{width:100%;max-width:620px;background:var(--ivory);border-radius:var(--r-xl);
  box-shadow:var(--lift);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.find-top{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--rule)}
.find-top svg{opacity:.5;flex:0 0 auto}
.find-top input{flex:1;border:0;outline:none;background:none;font-size:17px;font-weight:500}
.find-top kbd{font:inherit;font-size:11px;color:var(--muted);border:1px solid var(--rule-strong);
  border-radius:6px;padding:2px 7px}
.find-res{overflow-y:auto;padding:8px}
.find-g{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:12px 14px 6px}
.find-i{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);
  cursor:pointer;transition:background .15s}
.find-i:hover,.find-i.sel{background:var(--ivory-lo)}
.find-i>span:nth-child(2){display:flex;flex-direction:column;min-width:0;line-height:1.35}
.find-n{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.find-s{display:block;font-size:12.5px;color:var(--muted)}

function isoToDate(v){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));
  return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(TODAY.getTime());
}
function dateToIso(d){
  if(typeof d==='string')return /^\d{4}-\d{2}-\d{2}/.test(d)?d.slice(0,10):dateToIso(TODAY);
  if(!d||typeof d.getFullYear!=='function')return dateToIso(TODAY);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
/* Договор с сервера хранит только исходные поля — остальное считаем здесь. */
function enrich(c){
  var o={},k;for(k in c)o[k]=c[k];
  o.price=+c.price||0; o.down=+c.down||0; o.term=+c.term||12; o.markup=+c.markup||0;
  o.fin=Math.round(o.price*(1-o.down/100));
  o.mk=Math.round(o.fin*o.markup/100);
  o.total=o.fin+o.mk;
  o.mo=o.term?Math.round(o.total/o.term):0;
  o.paid=Math.min(o.term,Math.max(0,+c.paid||0));
  o.startISO=c.start||dateToIso(TODAY);
  o.start=isoToDate(o.startISO);
  if(o.paid<o.term){
    var next=addM(o.start,o.paid+1);
    o.late=Math.max(0,Math.round((TODAY-next)/86400000));
  }else o.late=0;
  return o;
}
/* Заявки с сервера приводим к виду, который ждут экраны CRM. */
function mergeLeads(rows){
  var byId={};state.deals.forEach(function(d,i){byId[d.id]=i});
  rows.filter(function(l){return !l.deleted}).forEach(function(l){
    var item={
      id:l.id,name:l.name,phone:l.phone||'',prod:l.prod||'—',city:l.city||'—',
      sum:+l.sum||0,term:+l.term||12,down:30,mgr:l.mgr||'Не назначен',
      stage:l.stage||'new',days:0,score:+l.score||0,
      note:l.note||'',at:l.at||'',notes:l.notes||[],src:'lead'
    };
    if(byId[l.id]!==undefined)state.deals[byId[l.id]]=item;
    else state.deals.unshift(item);
  });
}
function rawContract(c){
  return {id:c.id||'',name:c.name||'',city:c.city||'',prod:c.prod||'',phone:c.phone||'',
          price:c.price||0,down:c.down||0,term:c.term||12,markup:c.markup||0,
          paid:c.paid||0,start:c.startISO||dateToIso(c.start||TODAY),
          note:c.note||'',leadId:c.leadId||''};
}
/* ============ CRM: ПРОИЗВОДНЫЕ ============ */
function schedule(c){
  var rows=[],i,d;
  for(i=1;i<=c.term;i++){
    d=addM(c.start,i);
    rows.push({n:i,date:d,sum:i===c.term?c.total-c.mo*(c.term-1):c.mo});
  }
  return rows;
}
function clientsFromContracts(){
  var m={};
  CONTRACTS.forEach(function(c){
    if(!m[c.name])m[c.name]={name:c.name,city:c.city||'—',n:0,total:0,rest:0,late:0,prods:{}};
    var o=m[c.name];o.n++;o.total+=c.total;o.rest+=restOf(c);
    o.late=Math.max(o.late,c.late);if(c.prod)o.prods[c.prod]=1;
  });
  return Object.keys(m).map(function(k){
    var o=m[k];o.prod=Object.keys(o.prods).join(', ')||'—';
    o.st=o.late>30?'crit':(o.late>0?'warn':'ok');
    return o;
  });
}
/* Выдачи по месяцам — из дат договоров, а не из зашитых чисел. */
function issueSeries(){
  var map={},out=[],i,d,k;
  CONTRACTS.forEach(function(c){
    k=c.start.getFullYear()+'-'+c.start.getMonth();
    map[k]=(map[k]||0)+c.fin;
  });
  for(i=11;i>=0;i--){
    d=addM(TODAY,-i);k=d.getFullYear()+'-'+d.getMonth();
    out.push({m:MONTHS[d.getMonth()],v:Math.round((map[k]||0)/1e5)/10,part:i===0});
  }
  return out;
}
/* Портфель нарастающим итогом по тем же месяцам. */
function portfolioSeries(){
  var iss=issueSeries(),acc=0;
  return iss.map(function(x){acc+=x.v;return {m:x.m,v:Math.round(acc*10)/10}});
}

function deepMerge(base,patch){
  if(patch===null||patch===undefined)return base;
  if(Array.isArray(base))return Array.isArray(patch)?patch:base;
  if(typeof base!=='object')return patch;
  if(typeof patch!=='object')return base;
  var out={},k;
  for(k in base)out[k]=deepMerge(base[k],patch[k]);
  for(k in patch)if(!(k in out))out[k]=patch[k];
  return out;
}
function loadLocal(){
  try{
    var raw=localStorage.getItem(LS);if(!raw)return;
    var d=JSON.parse(raw);
    if(d.content)CONTENT=deepMerge(clone(DEFAULT_CONTENT),d.content);
    if(d.cfg)CFG=deepMerge(CFG,d.cfg);
    if(d.leads&&d.leads.length)d.leads.forEach(function(l){state.deals.unshift(l)});
    if(Array.isArray(d.contracts))CONTRACTS=d.contracts.map(enrich);
  }catch(e){}
}
function persistLocal(){
  try{
    localStorage.setItem(LS,JSON.stringify({
      v:4,content:CONTENT,cfg:CFG,
      leads:state.deals.filter(function(d){return d.src==='lead'}),
      contracts:CONTRACTS.map(rawContract)
    }));
    return true;
  }catch(e){return false}
}
function persist(){
  if(SRV.on)return true;
  return persistLocal();
}

var API='/api/';
var SRV={on:false,installed:false,authed:false,locked:false,csrf:'',user:null};
function api(action,opts,cb){
  opts=opts||{};
  var o={method:opts.method||'GET',credentials:'same-origin',headers:{}};
  if(opts.body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(opts.body)}
  if(SRV.csrf)o.headers['X-CSRF']=SRV.csrf;
  var done=false;
  var t=setTimeout(function(){if(!done){done=true;cb(null,'timeout')}},12000);
  fetch(API+'?a='+action,o).then(function(r){
    return r.text().then(function(txt){
      var d=null;try{d=JSON.parse(txt)}catch(e){}
      return {ok:r.ok,status:r.status,data:d};
    });
  }).then(function(r){
    if(done)return;done=true;clearTimeout(t);
    if(!r.data)return cb(null,'Сервер ответил не JSON (код '+r.status+')');
    if(r.data.csrf)SRV.csrf=r.data.csrf;
    if(!r.ok||r.data.ok===false)return cb(null,r.data.error||('Ошибка '+r.status));
    cb(r.data,null);
  }).catch(function(e){
    if(done)return;done=true;clearTimeout(t);
    cb(null,String(e&&e.message||e));
  });
}

/* ============ TOAST ============ */
var toastT;
function toast(msg){
  var t=$('#toast');t.innerHTML='<span style="opacity:.5">●</span> '+esc(msg);
  t.hidden=false;requestAnimationFrame(function(){t.classList.add('on')});
  clearTimeout(toastT);
  toastT=setTimeout(function(){
    t.classList.remove('on');setTimeout(function(){t.hidden=true},300);
  },2900);
}

/* ============ GATE ============ */
var pickUser=USERS[0];
var pendingHub='#dash';
function gateInit(){
  if(SRV.on)return gateServer();
  var box=$('#gateUsers');box.innerHTML='';
  $('#gateTitle').textContent='Вход в хаб';
  $('#gateHint').textContent='Сервер недоступен — работает автономный режим. Выберите роль, чтобы посмотреть интерфейс.';
  USERS.forEach(function(u){
    var b=el('button','gu');
    b.type='button';
    b.setAttribute('aria-pressed',String(u===pickUser));
    b.innerHTML='<span class="gu-av">'+esc(ini(u.name))+'</span><span><span class="gu-n">'+
      esc(u.name)+'</span><span class="gu-r">'+esc(u.role)+'</span></span><span class="gu-chk">✓</span>';
    b.addEventListener('click',function(){
      pickUser=u;
      $$('.gu',box).forEach(function(o){o.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed','true');
    });
    box.appendChild(b);
  });
  $('#gateGo').addEventListener('click',function(){
    state.user=pickUser;enterHub();
  });
}
function enterHub(){
  Store.loadContracts(function(){
  Store.loadLeads(function(){
    if(location.hash===pendingHub)route();
    else location.hash=pendingHub;
  });
  });
}
function gateServer(){
  var first=!SRV.installed&&!SRV.locked;
  if(!first&&!SRV.installed){
    $('#gateTitle').textContent='Доступ закрыт';
    $('#gateHint').textContent='Учётные записи выдаёт владелец в разделе «Пользователи». '+
      'Если доступа нет — обратитесь к нему.';
    $('#gateUsers').innerHTML='';
    $('#gateGo').style.display='none';
    return;
  }
  $('#gateTitle').textContent=first?'Создание учётной записи':'Вход';
  $('#gateHint').textContent=first
    ? 'Первый вход. Создайте учётную запись владельца — она даёт полный доступ, включая управление другими сотрудниками. Пароль хранится в зашифрованном виде и восстановлению не подлежит: запишите его.'
    : 'Введите логин и пароль.';
  var box=$('#gateUsers');
  var f=function(id,label,type,ac,ph,hint,extra){
    var pw=type==='password';
    return '<div style="padding:0 0 12px"><label class="lbl">'+label+'</label>'+
      '<div class="'+(pw?'pw-wrap':'')+'">'+
      '<input class="inp" type="'+type+'" id="'+id+'" autocomplete="'+ac+'"'+(extra||'')+
      (ph?' placeholder="'+ph+'"':'')+'>'+
      (pw?'<button type="button" class="pw-eye" data-eye="'+id+'" aria-label="Показать пароль" tabindex="-1">'+
        '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">'+
        '<path d="M1.5 10S4.5 4.5 10 4.5 18.5 10 18.5 10 15.5 15.5 10 15.5 1.5 10 1.5 10z"/>'+
        '<circle cx="10" cy="10" r="2.6"/></svg></button>':'')+
      '</div>'+
      (hint?'<div class="gate-hint">'+hint+'</div>':'')+'</div>';
  };
  var lat=' autocapitalize="off" autocorrect="off" spellcheck="false"';
  box.innerHTML=(first?f('gateName','Имя и фамилия','text','name','Иван Иванов'):'')+
    f('gateLogin','Логин','text','username','',first?'Только латиница и цифры. Например: zkachaev':'',lat)+
    f('gatePw','Пароль','password',first?'new-password':'current-password','',
      first?'Минимум 8 символов. Нажмите на глаз справа и проверьте, что видите именно те символы — частая ошибка это включённая русская раскладка.'
           :'Не подходит пароль? Нажмите на глаз и проверьте раскладку клавиатуры.')+
    (first?f('gatePw2','Повторите пароль','password','new-password',''):'');
  box.style.background='transparent';box.style.border='0';box.style.padding='0';box.style.gap='0';
  var go=$('#gateGo');
  go.querySelector('span').textContent=first?'Создать и войти':'Войти';
  var busy=false;
  var bad=function(id,msg){
    $$('.inp',box).forEach(function(i){i.classList.remove('err')});
    var e=$('#'+id);if(e){e.classList.add('err');e.focus()}
    toast(msg);
  };
  var submit=function(){
    if(busy)return;
    var raw=($('#gateLogin').value||'').trim();
    var login=raw.toLowerCase();
    var pw=$('#gatePw').value;
    if(!raw){return bad('gateLogin','Впишите логин — поле пустое. Серый текст это подсказка')}
    if(raw.length<3){return bad('gateLogin','Логин слишком короткий: минимум 3 символа')}
    if(raw.length>32){return bad('gateLogin','Логин слишком длинный: максимум 32 символа')}
    if(!/^[a-z0-9_.-]+$/.test(login)){
      return bad('gateLogin','В логине только латинские буквы, цифры, дефис, точка и подчёркивание. Кириллица, пробелы и @ не подходят');
    }
    if(first){
      if(!($('#gateName').value||'').trim()){return bad('gateName','Впишите имя и фамилию')}
      if(pw.length<8){return bad('gatePw','Пароль короче 8 символов — сейчас '+pw.length)}
      if(pw!==$('#gatePw2').value){return bad('gatePw2','Пароли не совпадают')}
    }else if(!pw){return bad('gatePw','Введите пароль')}
    $$('.inp',box).forEach(function(i){i.classList.remove('err')});
    busy=true;go.disabled=true;
    var after=function(err){
      busy=false;go.disabled=false;
      if(err){
        if(/логин/i.test(err))bad('gateLogin',err);
        else if(/парол/i.test(err))bad('gatePw',err);
        else toast(err);
        return;
      }
      state.user=SRV.user||{name:login,role:'Владелец'};
      enterHub();
    };
    if(first)Store.install(login,($('#gateName').value||'').trim(),pw,after);
    else Store.login(login,pw,after);
  };
  go.onclick=submit;
  $$('.pw-eye',box).forEach(function(b){
    b.addEventListener('click',function(){
      var inp=$('#'+b.dataset.eye);if(!inp)return;
      var show=inp.type==='password';
      inp.type=show?'text':'password';
      b.classList.toggle('on',show);
      b.setAttribute('aria-label',show?'Скрыть пароль':'Показать пароль');
      inp.focus();
    });
  });
  ['gateName','gateLogin','gatePw','gatePw2'].forEach(function(id){
    var e=$('#'+id);if(e)e.addEventListener('keydown',function(ev){if(ev.key==='Enter')submit()});
  });
  setTimeout(function(){var e=$(first?'#gateName':'#gateLogin');if(e)e.focus()},80);
}

/* ============ ДОСТУП ПО ПУТИ ============ */
function getp(p){
  var a=p.split('.'),o=CONTENT,i;
  for(i=0;i<a.length;i++){if(o==null)return undefined;o=o[a[i]]}
  return o;
}
function setp(p,v){
  var a=p.split('.'),o=CONTENT,i;
  for(i=0;i<a.length-1;i++){if(o[a[i]]==null)o[a[i]]={};o=o[a[i]]}
  o[a[a.length-1]]=v;
}
function markDirty(){
  state.dirty=true;siteStale=true;
  var b=$('#admBar');if(b)b.classList.add('on');
}

/* ============ РЕДАКТОР КОНТЕНТА ============ */
function fieldHtml(id,label,val,type,hint,attrs){
  var inp;
  if(type==='area')inp='<textarea class="ai" '+attrs+'>'+esc(val)+'</textarea>';
  else if(type==='num')inp='<input class="ai" type="number" value="'+esc(val)+'" '+attrs+'>';
  else if(type==='sel')inp=id;
  else inp='<input class="ai" type="text" value="'+esc(val)+'" '+attrs+'>';
  return '<div class="fw'+(hint&&hint.full?' full':'')+'"><label>'+esc(label)+'</label>'+inp+
    (hint&&hint.text?'<div class="hint">'+hint.text+'</div>':'')+'</div>';
}
function selHtml(val,opts,attrs){
  return '<select class="ai" '+attrs+'>'+opts.map(function(o){
    return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';
  }).join('')+'</select>';
}
function listBlock(L){
  var arr=getp(L.p)||[];
  var h='<div class="fw full" style="margin-top:6px"><label>'+esc(L.l)+' — '+arr.length+'</label>';
  if(L.hint)h+='<div class="hint" style="margin:-2px 0 10px">'+esc(L.hint)+'</div>';
  h+='<div class="rep">'+arr.map(function(it,i){
    var title=String(it[L.title]||'').slice(0,60)||('Пункт '+(i+1));
    return '<div class="rep-i"><div class="rep-h">'+
      '<span class="rep-num">'+(i+1)+'</span><span class="rep-t">'+esc(title)+'</span>'+
      '<button class="rep-btn" data-mv="up" data-lp="'+esc(L.p)+'" data-i="'+i+'"'+(i===0?' disabled':'')+' title="Выше">↑</button>'+
      '<button class="rep-btn" data-mv="down" data-lp="'+esc(L.p)+'" data-i="'+i+'"'+(i===arr.length-1?' disabled':'')+' title="Ниже">↓</button>'+
      (L.fixed?'':'<button class="rep-btn del" data-del="1" data-lp="'+esc(L.p)+'" data-i="'+i+'" title="Удалить">✕</button>')+
      '</div><div class="rep-b"><div class="fset">'+
      L.fields.map(function(f){
        var at='data-lp="'+esc(L.p)+'" data-i="'+i+'" data-k="'+esc(f.k)+'"';
        var v=it[f.k]==null?'':it[f.k];
        if(f.type==='sel')return fieldHtml(selHtml(v,f.opts,at),f.l,v,'sel',{full:f.full,text:f.hint});
        return fieldHtml(null,f.l,v,f.type,{full:f.full,text:f.hint},at);
      }).join('')+
      '</div></div></div>';
  }).join('')+'</div>';
  if(!L.fixed)h+='<button class="btn btn-ghost btn-sm" style="margin-top:12px" data-add="1" data-lp="'+esc(L.p)+'"><span>+ Добавить</span></button>';
  return h+'</div>';
}

var delegatesBound=false;
function contentDelegates(){
  if(delegatesBound)return;
  delegatesBound=true;
  var body=$('#hubBody');
  body.addEventListener('input',function(e){
    if(state.page!=='content')return;
    var t=e.target;
    if(t.dataset.p!==undefined&&t.dataset.p){
      var v=t.type==='number'?(+t.value||0):t.value;
      setp(t.dataset.p,v);markDirty();return;
    }
    if(t.dataset.lp&&t.dataset.k){
      var arr=getp(t.dataset.lp);
      if(arr&&arr[+t.dataset.i]){arr[+t.dataset.i][t.dataset.k]=t.value;markDirty()}
      return;
    }
    if(t.dataset.sp&&t.dataset.i!==undefined&&t.tagName==='INPUT'){
      var a2=getp(t.dataset.sp);
      if(a2){a2[+t.dataset.i]=t.value;markDirty()}
    }
  });
  body.addEventListener('change',function(e){
    if(state.page!=='content')return;
    var t=e.target;
    if(t.tagName==='SELECT'&&t.dataset.lp&&t.dataset.k){
      var arr=getp(t.dataset.lp);
      if(arr&&arr[+t.dataset.i]){arr[+t.dataset.i][t.dataset.k]=t.value;markDirty()}
    }
  });
  body.addEventListener('click',function(e){
    if(state.page!=='content')return;
    var b=e.target.closest('[data-add],[data-del],[data-mv]');
    if(!b)return;
    var path=b.dataset.lp||b.dataset.sp,arr=getp(path);
    if(!arr)return;
    var i=+b.dataset.i;
    if(b.dataset.add){
      if(b.dataset.sp){
        var sl=findStrList(path);arr.push(sl?sl.blank:'Новый пункт');
      }else{
        var ls=findList(path);arr.push(clone(ls.blank));
      }
    }else if(b.dataset.del){
      if(arr.length<=1){toast('Нельзя удалить последний элемент');return}
      arr.splice(i,1);
    }else if(b.dataset.mv){
      var j=b.dataset.mv==='up'?i-1:i+1;
      if(j<0||j>=arr.length)return;
      var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
    }
    markDirty();render();
  });
}

function exportJson(){
  var data=JSON.stringify({v:4,content:CONTENT,cfg:CFG},null,2);
  var name='zk-finance-content-'+dfull(new Date()).replace(/\./g,'-')+'.json';
  drawerOpen('Контент сайта в JSON','сохраните файл или скопируйте текст',
    '<p style="font-size:13.5px;color:var(--muted);line-height:1.55">Этот файл — весь текст сайта и условия продукта. '+
    'Им переносят контент на другое устройство, отдают разработчику или держат как резервную копию. '+
    'Загрузить обратно — кнопкой «Загрузить JSON».</p>'+
    '<textarea class="ai" id="jsonOut" style="min-height:340px;font-size:12px;line-height:1.5" readonly>'+esc(data)+'</textarea>',
    '<button class="btn" id="jsonDl"><span>Скачать файлом</span></button>'+
    '<button class="btn btn-out" id="jsonCopy"><span>Скопировать текст</span></button>');
  $('#jsonDl').addEventListener('click',function(){
    try{
      var blob=new Blob([data],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download=name;a.rel='noopener';
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},600);
      toast('Если файл не сохранился — скопируйте текст кнопкой рядом');
    }catch(e){
      toast('Скачивание недоступно здесь — скопируйте текст');
    }
  });
  $('#jsonCopy').addEventListener('click',function(){
    var ta=$('#jsonOut');
    var done=function(){toast('JSON скопирован в буфер обмена')};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(data).then(done,function(){legacyCopy(ta,done)});
    }else legacyCopy(ta,done);
  });
}
function legacyCopy(ta,done){
  try{
    ta.removeAttribute('readonly');ta.select();ta.setSelectionRange(0,999999);
    var ok=document.execCommand('copy');
    ta.setAttribute('readonly','readonly');
    if(ok)done();else toast('Не вышло скопировать — выделите текст вручную');
  }catch(e){toast('Не вышло скопировать — выделите текст вручную')}
}
function importInit(){

/* ============ DERIVED ============ */
function paidOf(c){return Math.min(c.term,Math.max(0,c.paid||0))}
function restOf(c){return Math.max(0,c.total-c.mo*paidOf(c))}
function portfolio(){var t=0;CONTRACTS.forEach(function(c){t+=restOf(c)});return t}
function activeCount(){return CONTRACTS.filter(function(c){return paidOf(c)<c.term}).length}
function inWork(){return state.deals.filter(function(d){return d.stage!=='issued'}).length}
function overdueList(){return CONTRACTS.filter(function(c){return c.late>0&&paidOf(c)<c.term})}
function overdueSum(){var t=0;overdueList().forEach(function(c){t+=c.mo});return t}
function overdueCount(){return overdueList().length}
function collected(){var t=0;CONTRACTS.forEach(function(c){t+=c.mo*paidOf(c)});return t}
function markupTotal(){var t=0;CONTRACTS.forEach(function(c){t+=c.mk});return t}
function avgTicket(){
  if(!CONTRACTS.length)return 0;
  var t=0;CONTRACTS.forEach(function(c){t+=c.total});return Math.round(t/CONTRACTS.length);
}
function avgTerm(){
  if(!CONTRACTS.length)return 0;
  var t=0;CONTRACTS.forEach(function(c){t+=c.term});return Math.round(t/CONTRACTS.length);
}
function repeatShare(){
  var m={},rep=0,tot=0;
  CONTRACTS.forEach(function(c){m[c.name]=(m[c.name]||0)+1});
  Object.keys(m).forEach(function(k){tot++;if(m[k]>1)rep++});
  return tot?Math.round(rep/tot*100):0;
}
function approvalRate(){
  var done=state.deals.filter(function(d){return d.stage==='issued'}).length;
  var all=done+REJECTED.length;
  return all?Math.round(done/all*100):0;
}
