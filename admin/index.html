var CHARTS=[];
function setupCanvas(cv,h){
  var w=cv.parentElement.offsetWidth;
  if(!w)return null;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.height=h+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
  return {x:x,w:w,h:h};
}
function barChart(cv,data,unit){
  var c=setupCanvas(cv,190);if(!c)return;
  var x=c.x,w=c.w,h=c.h,pad={t:16,r:4,b:24,l:38};
  var iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  var max=Math.max.apply(null,data.map(function(d){return d.v}));
  max=Math.ceil(max/40)*40;
  var ink=cssv('--ink'),rule=cssv('--rule'),mut=cssv('--muted'),lo=cssv('--ivory-lo');
  x.font='500 10px Manrope,Arial,sans-serif';x.textBaseline='middle';
  for(var g=0;g<=4;g++){
    var gy=pad.t+ih-ih*g/4;
    x.strokeStyle=rule;x.lineWidth=1;x.beginPath();
    x.moveTo(pad.l,gy+.5);x.lineTo(w-pad.r,gy+.5);x.stroke();
    x.fillStyle=mut;x.textAlign='right';x.fillText(String(max*g/4),pad.l-8,gy);
  }
  var bw=iw/data.length,bar=Math.min(26,bw*0.56);
  data.forEach(function(d,i){
    var bh=ih*d.v/max,bx=pad.l+bw*i+(bw-bar)/2,by=pad.t+ih-bh;
    x.fillStyle=d.part?lo:ink;x.fillRect(bx,by,bar,bh);
    if(d.part){x.strokeStyle=ink;x.lineWidth=1;x.strokeRect(bx+.5,by+.5,bar-1,bh-1)}
    x.fillStyle=mut;x.textAlign='center';
    x.fillText(d.m,pad.l+bw*i+bw/2,h-10);
  });
  x.fillStyle=mut;x.textAlign='left';x.fillText(unit||'',pad.l,7);
}
function areaChart(cv,data,unit){
  var c=setupCanvas(cv,190);if(!c)return;
  var x=c.x,w=c.w,h=c.h,pad={t:16,r:8,b:24,l:44};
  var iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  var vals=data.map(function(d){return d.v});
  var max=Math.ceil(Math.max.apply(null,vals)/100)*100,min=0;
  var ink=cssv('--ink'),rule=cssv('--rule'),mut=cssv('--muted'),iv=cssv('--ivory');
  var px=function(i){return pad.l+iw*i/(data.length-1)};
  var py=function(v){return pad.t+ih-ih*(v-min)/(max-min)};
  x.font='500 10px Manrope,Arial,sans-serif';x.textBaseline='middle';
  for(var g=0;g<=4;g++){
    var gy=pad.t+ih-ih*g/4;
    x.strokeStyle=rule;x.lineWidth=1;x.beginPath();
    x.moveTo(pad.l,gy+.5);x.lineTo(w-pad.r,gy+.5);x.stroke();
    x.fillStyle=mut;x.textAlign='right';x.fillText(String(Math.round(max*g/4)),pad.l-8,gy);
  }
  x.beginPath();x.moveTo(px(0),py(vals[0]));
  vals.forEach(function(v,i){if(i)x.lineTo(px(i),py(v))});
  x.lineTo(px(vals.length-1),pad.t+ih);x.lineTo(px(0),pad.t+ih);x.closePath();
  var gr=x.createLinearGradient(0,pad.t,0,pad.t+ih);
  gr.addColorStop(0,hexA(ink,.16));gr.addColorStop(1,hexA(ink,0));
  x.fillStyle=gr;x.fill();
  x.beginPath();x.moveTo(px(0),py(vals[0]));
  vals.forEach(function(v,i){if(i)x.lineTo(px(i),py(v))});
  x.strokeStyle=ink;x.lineWidth=1.6;x.stroke();
  var lx=px(vals.length-1),ly=py(vals[vals.length-1]);
  x.fillStyle=iv;x.beginPath();x.arc(lx,ly,4.5,0,7);x.fill();
  x.strokeStyle=ink;x.lineWidth=2;x.beginPath();x.arc(lx,ly,4.5,0,7);x.stroke();
  x.fillStyle=mut;x.textAlign='center';
  data.forEach(function(d,i){if(i%2===0)x.fillText(d.m,px(i),h-10)});
  x.textAlign='left';x.fillText(unit||'',pad.l,7);
}
function hexA(hex,a){
  hex=(hex||'#000').replace('#','');
  if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var n=parseInt(hex,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function chart(kind,data,unit,h){
  var id='ch'+CHARTS.length;

  return '<div class="chart-wrap"><canvas class="chart" id="'+id+'"></canvas></div>';
}

    var cv=document.getElementById(c.id);if(!cv)return;
    (c.kind==='area'?areaChart:barChart)(cv,c.data,c.unit);
  });
}

function leadPhone(d){
  if(d.phone)return d.phone;
  var m=/(\+?\d[\d\s()-]{8,})/.exec(d.note||'');
  return m?m[0].trim():'';
}
function pgDash(){
  var por=portfolio(),odc=overdueCount(),odSum=overdueSum();
  var odPct=por?(odSum/por*100).toFixed(1).replace('.',','):'0,0';
  var fresh=state.deals.filter(function(d){return d.stage==='new'});
  var week=CONTRACTS.filter(function(c){return paidOf(c)<c.term}).map(function(c){
    return {c:c,d:nextPay(c),s:payStatus(c)};
  }).filter(function(p){
    var days=Math.round((p.d-TODAY)/86400000);
    return days>=0&&days<=7;
  }).sort(function(a,b){return a.d-b.d});

  var h='<div class="kpis">'+
    kpi('Портфель','<span class="num">'+short(por)+'</span>','остаток к получению')+
    kpi('Договоров','<span class="num">'+CONTRACTS.length+'</span>','активных '+activeCount())+
    kpi('Новых заявок','<span class="num">'+fresh.length+'</span>','всего в работе '+inWork())+
    kpi('Просрочка','<span class="num">'+odPct+'<small>%</small></span>',odc+' договоров · '+short(odSum))+
    kpi('Средний чек','<span class="num">'+short(avgTicket())+'</span>','по договору')+
    '</div>';

  /* — что требует действия прямо сейчас — */
  var todo='';
  if(odc){
    todo+='<div class="todo-g"><div class="todo-h"><span class="chip crit">Просрочка</span>'+
      '<span class="todo-n">'+odc+'</span></div>'+
      overdueList().sort(function(a,b){return b.late-a.late}).slice(0,6).map(function(c){
        return '<div class="todo-i" data-ct="'+esc(c.id)+'">'+
          '<span class="av">'+esc(ini(c.name))+'</span>'+
          '<span class="todo-t"><b>'+esc(c.name)+'</b>'+
          '<span class="who-s">'+esc(c.id)+' · '+money(c.mo)+' · '+c.late+' дн</span></span>'+
          '<span class="todo-a" onclick="event.stopPropagation()">'+telLink(c.phone,'Позвонить')+'</span>'+
          '</div>';
      }).join('')+'</div>';
  }
  if(fresh.length){
    todo+='<div class="todo-g"><div class="todo-h"><span class="chip info">Новые заявки</span>'+
      '<span class="todo-n">'+fresh.length+'</span></div>'+
      fresh.slice(0,6).map(function(d){
        return '<div class="todo-i" data-lead="'+esc(d.id)+'">'+
          '<span class="av">'+esc(ini(d.name))+'</span>'+
          '<span class="todo-t"><b>'+esc(d.name)+'</b>'+
          '<span class="who-s">'+esc(d.prod||'—')+' · '+money(d.sum||0)+' · '+esc(d.city||'—')+'</span></span>'+
          '<span class="todo-a" onclick="event.stopPropagation()">'+telLink(leadPhone(d),'Позвонить')+'</span>'+
          '</div>';
      }).join('')+'</div>';
  }
  if(!todo)todo=emptyBlock('Срочных дел нет',
    CONTRACTS.length||state.deals.length
      ? 'Просрочек нет, новые заявки разобраны.'
      : 'Заявки с сайта и заведённые договоры появятся здесь.');

  var wk=week.length
    ? '<div class="tbl-scroll"><table class="tbl"><thead><tr>'+
      '<th>Дата</th><th>Клиент</th><th>Договор</th><th class="r">Платёж</th><th></th>'+
      '</tr></thead><tbody>'+week.map(function(p){
        return '<tr data-ct="'+esc(p.c.id)+'"><td class="n">'+dstr(p.d)+'</td>'+
          '<td><div class="who"><span class="av">'+esc(ini(p.c.name))+'</span>'+
          '<span class="who-n">'+esc(p.c.name)+'</span></div></td>'+
          '<td class="id">'+esc(p.c.id)+'</td><td class="r n">'+money(p.c.mo)+'</td>'+
          '<td class="r"><button class="filt pay-btn" data-pay="'+esc(p.c.id)+'">Принять</button></td></tr>';
      }).join('')+'</tbody></table></div>'
    : emptyBlock('На неделе платежей нет','Ближайшие семь дней свободны.');

  var feed=[];
  state.deals.slice(0,5).forEach(function(d){
    feed.push([d.at?dstr(new Date(d.at)):'—',
      'Заявка <b>'+esc(d.id)+'</b> · '+esc(d.name)+' · '+money(d.sum||0)]);
  });
  CONTRACTS.slice().sort(function(a,b){return b.start-a.start}).slice(0,4).forEach(function(c){
    feed.push([dstr(c.start),'Договор <b>'+esc(c.id)+'</b> · '+esc(c.name)+' · '+money(c.total)]);
  });
  var fd=feed.length
    ? '<div class="feed">'+feed.map(function(f){
        return '<div class="fi"><span class="fi-t">'+esc(f[0])+'</span><span class="fi-txt">'+f[1]+'</span></div>';
      }).join('')+'</div>'
    : emptyBlock('Событий пока нет','Здесь появятся заявки с сайта и заведённые договоры.');

  h+='<div class="grid-2">'+
    card('Требуют внимания',todo,odc||fresh.length?'сегодня':'',odc||fresh.length?false:true)+
    card('Платежи на неделю',wk,week.length?week.length+' шт.':'',week.length?false:true)+
    '</div>';
  h+='<div class="grid-2">'+
    card('Выдачи по месяцам',chart('bar',issueSeries(),'₽ млн'),'по датам договоров')+
    card('Последние события',fd,'')+
    '</div>';
  return h;
}

/* ============ PAGE: DEALS (KANBAN) ============ */
function pgDeals(){
  var q=state.q.toLowerCase();
  var list=state.deals.filter(function(d){
    if(state.filt!=='all'&&d.prod!==state.filt)return false;
    if(!q)return true;
    return (d.name+' '+d.id+' '+d.city+' '+d.prod).toLowerCase().indexOf(q)>=0;
  });
  var h='<div class="toolbar"><span class="eyebrow" style="margin-right:6px">Продукт</span>'+
    ['all'].concat(PRODUCTS).map(function(p){
      return '<button class="filt'+(state.filt===p?' on':'')+'" data-f="'+esc(p)+'">'+
        (p==='all'?'Все':esc(p))+'</button>';
    }).join('')+
    '<span style="margin-left:auto" class="eyebrow">'+list.length+' заявок · '+
    short(list.reduce(function(s,d){return s+d.sum},0))+'</span></div>';

  h+='<div class="kanban">'+STAGES.map(function(s){
    var arr=list.filter(function(d){return d.stage===s.id});
    var sum=arr.reduce(function(a,d){return a+d.sum},0);
    return '<div class="col" data-stage="'+s.id+'">'+
      '<div class="col-h"><span class="col-t">'+esc(s.t)+'</span><span class="col-c">'+arr.length+'</span></div>'+
      '<div class="col-sum">'+short(sum)+'</div>'+
      '<div class="col-b">'+arr.map(function(d){
        var sc=d.score>=75?'ok':(d.score>=60?'warn':(d.score?'crit':'neut'));
        return '<div class="kc" draggable="true" data-id="'+esc(d.id)+'">'+
          '<div class="kc-top"><span class="kc-id">'+esc(d.id)+'</span>'+
          '<span class="chip '+sc+'">'+(d.score?'скоринг '+d.score:'новый')+'</span></div>'+
          '<div><div class="kc-n">'+esc(d.name)+'</div>'+
          '<div class="kc-p">'+esc(d.prod)+' · '+esc(d.city)+'</div></div>'+
          '<div class="kc-sum">'+money(d.sum)+'</div>'+
          '<div class="kc-foot"><span class="av" style="width:22px;height:22px;font-size:9px">'+
          esc(ini(d.mgr))+'</span><span class="kc-p">'+d.term+' мес</span>'+
          '<span class="kc-days">'+d.days+'д</span></div></div>';
      }).join('')+'</div></div>';
  }).join('')+'</div>';

  if(!REJECTED.length)return h;
  h+=card('Отказы за период','<div class="tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Заявка</th><th>Клиент</th><th>Продукт</th><th class="r">Сумма</th><th>Причина</th><th>Кто</th>'+
    '</tr></thead><tbody>'+REJECTED.map(function(r){
      return '<tr><td class="id">'+esc(r.id)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.prod)+
      '</td><td class="r n">'+money(r.sum)+'</td><td><span class="chip crit">'+esc(r.reason)+
      '</span></td><td class="who-s">'+esc(r.by)+'</td></tr>';
    }).join('')+'</tbody></table></div>',REJECTED.length+' за 30 дней',false);
  return h;
}
function bindDeals(){
  $$('.filt').forEach(function(b){
    b.addEventListener('click',function(){state.filt=b.dataset.f;render()});
  });
  var dragId=null;
  $$('.kc').forEach(function(c){
    c.addEventListener('dragstart',function(e){
      dragId=c.dataset.id;c.classList.add('drag');
      try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}
    });
    c.addEventListener('dragend',function(){c.classList.remove('drag');dragId=null});
    c.addEventListener('click',function(){openDeal(c.dataset.id)});
  });
  $$('.col').forEach(function(col){
    col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('drop')});
    col.addEventListener('dragleave',function(){col.classList.remove('drop')});
    col.addEventListener('drop',function(e){
      e.preventDefault();col.classList.remove('drop');
      var id=dragId;try{id=e.dataTransfer.getData('text/plain')||dragId}catch(x){}
      var d=state.deals.filter(function(o){return o.id===id})[0];
      if(!d)return;
      var to=col.dataset.stage;
      if(d.stage===to)return;
      d.stage=to;d.days=0;
      if(d.src==='lead')Store.setStage(d.id,to);else persist();
      var st=STAGES.filter(function(s){return s.id===to})[0];
      render();toast(d.id+' → «'+st.t+'»');
    });
  });
}

/* ============ PAGE: PAYMENTS ============ */
function pgPayments(){
  var rows=[];
  CONTRACTS.forEach(function(c){
    if(paidOf(c)>=c.term)return;
    rows.push({c:c,d:nextPay(c),s:payStatus(c)});
  });
  rows.sort(function(a,b){
    var r={crit:0,warn:1,info:2,neut:3};
    return (r[a.s.cls]-r[b.s.cls])||(a.d-b.d);
  });
  var due=0,late=0;
  rows.forEach(function(r){due+=r.c.mo;if(r.s.cls==='crit'||r.s.cls==='warn')late+=r.c.mo});
  var body='<div class="tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Дата</th><th>Клиент</th><th>Договор</th><th class="r">Сумма</th>'+
    '<th class="r">Платёж</th><th>Статус</th><th></th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr data-ct="'+esc(r.c.id)+'">'+
        '<td class="n">'+dfull(r.d)+'</td>'+
        '<td><div class="who"><span class="av">'+esc(ini(r.c.name))+'</span>'+
        '<span><span class="who-n">'+esc(r.c.name)+'</span>'+
        '<span class="who-s">'+esc(r.c.city)+'</span></span></div></td>'+
        '<td class="id">'+esc(r.c.id)+'</td>'+
        '<td class="r n">'+money(r.c.mo)+'</td>'+
        '<td class="r n who-s">'+(paidOf(r.c)+1)+' из '+r.c.term+'</td>'+
        '<td><span class="chip '+r.s.cls+'">'+esc(r.s.t)+'</span></td>'+
        '<td class="r"><button class="filt pay-btn" data-pay="'+esc(r.c.id)+'">Отметить оплату</button></td>'+
        '</tr>';
    }).join('')+'</tbody></table></div>';
  if(!rows.length){
    return card('Реестр платежей',emptyBlock('Ожидаемых платежей нет',
      CONTRACTS.length?'Все договоры закрыты.':'Заведите договор — график платежей появится автоматически.'),'',false);
  }
  return '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">'+
    kpi('К поступлению','<span class="num">'+short(due)+'</span>','ближайший платёж по каждому договору')+
    kpi('Просрочено','<span class="num">'+short(late)+'</span>',overdueCount()+' договоров')+
    kpi('Собрано всего','<span class="num">'+short(collected())+'</span>','по принятым платежам')+
    '</div>'+card('Реестр платежей',body,rows.length+' ожидают',false);
}

/* ============ PAGE: ANALYTICS ============ */
function pgAnalytics(){
  if(!CONTRACTS.length){
    return card('Аналитика',emptyBlock('Считать пока нечего',
      'Отчёты строятся из договоров: как только появится первый, здесь будут портфель, '+
      'структура по продуктам и городам и качество портфеля.'),'',false);
  }
  var byProd={},byCity={},tot=0;
  CONTRACTS.forEach(function(c){
    var r=restOf(c);tot+=r;
    byProd[c.prod||'—']=(byProd[c.prod||'—']||0)+r;
    byCity[c.city||'—']=(byCity[c.city||'—']||0)+r;
  });
  function split(o){
    var ks=Object.keys(o).sort(function(a,b){return o[b]-o[a]});
    var mx=o[ks[0]]||1;
    return '<div class="split">'+ks.map(function(k){
      return '<div class="sp"><span>'+esc(k)+'</span>'+
        '<span class="sp-v">'+(tot?(o[k]/tot*100).toFixed(1).replace('.',','):'0')+'%</span>'+
        '<span class="sp-bar"><i style="width:'+(o[k]/mx*100)+'%"></i></span></div>';
    }).join('')+'</div>';
  }
  var buckets=[['Без просрочки',0,'ok'],['1–30 дней',0,'warn'],['31–60 дней',0,'crit'],['60+ дней',0,'neut']];
  CONTRACTS.forEach(function(c){
    var i=c.late<=0?0:(c.late<=30?1:(c.late<=60?2:3));
    buckets[i][1]++;
  });
  var bk='<div class="tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Бакет</th><th class="r">Договоров</th><th class="r">Доля</th><th>Качество</th>'+
    '</tr></thead><tbody>'+buckets.map(function(b){
      return '<tr style="cursor:default"><td>'+esc(b[0])+'</td><td class="r n">'+b[1]+'</td>'+
      '<td class="r n">'+(b[1]/CONTRACTS.length*100).toFixed(1).replace('.',',')+'%</td>'+
      '<td><span class="chip '+b[2]+'">'+
      (b[2]==='ok'?'норма':b[2]==='warn'?'внимание':b[2]==='crit'?'работа с долгом':'взыскание')+
      '</span></td></tr>';
    }).join('')+'</tbody></table></div>';
  return '<div class="kpis">'+
    kpi('Портфель','<span class="num">'+short(tot)+'</span>','остаток к получению')+
    kpi('Договоров','<span class="num">'+CONTRACTS.length+'</span>','активных '+activeCount())+

/* ============ ПОИСК ПО ВСЕЙ БАЗЕ ============ */
var findSel=0,findHits=[];
function digits(v){return String(v||'').replace(/\D/g,'')}
function findRun(){
  var q=($('#findInp').value||'').trim().toLowerCase();
  var dq=digits(q);
  findHits=[];findSel=0;
  if(q.length<2){
    $('#findRes').innerHTML='<div class="find-empty">Введите имя, телефон или номер — хотя бы два символа</div>';
    return;
  }
  var match=function(hay,phone){
    if(String(hay||'').toLowerCase().indexOf(q)>=0)return true;
    return dq.length>=3&&digits(phone).indexOf(dq)>=0;
  };
  state.deals.forEach(function(d){
    if(match(d.name+' '+d.id+' '+(d.prod||'')+' '+(d.city||''),d.phone||d.note))
      findHits.push({kind:'lead',t:d.name,s:'Заявка '+d.id+' · '+(d.prod||'—'),r:money(d.sum||0),o:d});
  });
  CONTRACTS.forEach(function(c){
    if(match(c.name+' '+c.id+' '+(c.prod||'')+' '+(c.city||''),c.phone))
      findHits.push({kind:'contract',t:c.name,s:'Договор '+c.id+' · '+(c.prod||'—'),r:money(c.total),o:c});
  });
  clientsFromContracts().forEach(function(c){
    if(match(c.name+' '+(c.city||''),''))
      findHits.push({kind:'client',t:c.name,s:'Клиент · '+(c.city||'—')+' · договоров '+c.n,r:money(c.rest),o:c});
  });
  findHits=findHits.slice(0,30);
  if(!findHits.length){
    $('#findRes').innerHTML='<div class="find-empty">Ничего не нашлось по запросу «'+esc(q)+'»</div>';
    return;
  }
  var groups={lead:'Заявки',contract:'Договоры',client:'Клиенты'},html='',last='';
  findHits.forEach(function(h,i){
    if(h.kind!==last){html+='<div class="find-g">'+groups[h.kind]+'</div>';last=h.kind}
    html+='<div class="find-i'+(i===0?' sel':'')+'" data-fi="'+i+'">'+
      '<span class="av">'+esc(ini(h.t))+'</span>'+
      '<span><span class="find-n">'+esc(h.t)+'</span><span class="find-s">'+esc(h.s)+'</span></span>'+
      '<span class="find-r">'+h.r+'</span></div>';
  });
  $('#findRes').innerHTML=html;
  $$('.find-i').forEach(function(e){
    e.addEventListener('click',function(){findGo(+e.dataset.fi)});
  });
}
function findGo(i){
  var h=findHits[i];if(!h)return;
  findClose();
  setTimeout(function(){
    if(h.kind==='lead'){state.page='deals';location.hash='#deals';setTimeout(function(){openDeal(h.o.id)},260)}
    else if(h.kind==='contract'){state.page='contracts';location.hash='#contracts';setTimeout(function(){openContract(h.o.id)},260)}
    else {state.page='clients';location.hash='#clients';setTimeout(function(){openClient(h.o.name)},260)}
  },60);
}
function findOpen(){
  $('#find').hidden=false;
  $('#findInp').value='';findRun();
  setTimeout(function(){$('#findInp').focus()},40);
}
function findClose(){$('#find').hidden=true}
function findInit(){
  $('#openSearch').addEventListener('click',findOpen);
  $('#find').addEventListener('click',function(e){if(e.target===$('#find'))findClose()});
  $('#findInp').addEventListener('input',findRun);
  $('#findInp').addEventListener('keydown',function(e){
    if(e.key==='Escape')return findClose();
    if(e.key==='Enter')return findGo(findSel);
    if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
    e.preventDefault();
    var items=$$('.find-i');if(!items.length)return;
    findSel=Math.max(0,Math.min(items.length-1,findSel+(e.key==='ArrowDown'?1:-1)));
    items.forEach(function(el,i){el.classList.toggle('sel',i===findSel)});
    items[findSel].scrollIntoView({block:'nearest'});
  });
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();findOpen()}
    else if(e.key==='Escape'&&!$('#find').hidden)findClose();
  });
}

  var term=c.term||12;
  var body='<div class="fset">'+
      f('kName','Клиент',c.name,'text',{full:true})+
      f('kPhone','Телефон',c.phone)+
      sel('kCity','Город',c.city||CONTENT.form.cities[0],CONTENT.form.cities)+
      sel('kProd','Продукт',c.prod||CONTENT.products.items[0].h,CONTENT.products.items.map(function(x){return x.h}))+
      f('kPrice','Стоимость товара, ₽',c.price||'','number',null,' min="0" step="1000"')+
      f('kDown','Первый взнос, %',c.down==null?30:c.down,'number',null,' min="0" max="90" step="1"')+
      sel('kTerm','Срок, месяцев',term,[6,12,18,24,36,60,120])+
      f('kMarkup','Наценка за весь срок, %',c.markup==null?(CFG.markup[term]||15):c.markup,'number',
        {text:'По умолчанию берётся из «Параметров продукта» для выбранного срока'},' min="0" max="300" step="1"')+
      f('kStart','Дата первого платежа отсчитывается от',c.startISO||dateToIso(TODAY),'date')+
      f('kPaid','Уже оплачено платежей',c.paid||0,'number',null,' min="0" step="1"')+
      f('kNote','Комментарий',c.note,'text',{full:true})+
    '</div>'+
    '<div class="kv" id="kPreview" style="margin-top:20px"></div>';
  var foot='<button class="btn" id="kSave"><span>'+(isNew?'Создать договор':'Сохранить')+'</span></button>'+
    (isNew?'':'<button class="btn btn-out" id="kDel"><span>Удалить</span></button>');
  drawerOpen(isNew?'Новый договор':('Договор '+c.id),
    isNew?(fromLead?'из заявки '+fromLead:'заполните данные сделки'):esc(c.name),body,foot);

  var collect=function(){
    return {id:c.id||'',leadId:c.leadId||fromLead||'',
      name:($('#kName').value||'').trim(),phone:($('#kPhone').value||'').trim(),
      city:$('#kCity').value,prod:$('#kProd').value,
      price:+$('#kPrice').value||0,down:+$('#kDown').value||0,
      term:+$('#kTerm').value||12,markup:+$('#kMarkup').value||0,
      paid:+$('#kPaid').value||0,start:$('#kStart').value||dateToIso(TODAY),
      note:($('#kNote').value||'').trim()};
  };
  var preview=function(){
    var e=enrich(collect());
    $('#kPreview').innerHTML=
      '<div><span class="kv-k">Финансируем</span><span class="kv-v">'+money(e.fin)+'</span></div>'+
      '<div><span class="kv-k">Наценка</span><span class="kv-v">'+money(e.mk)+'</span></div>'+
      '<div><span class="kv-k">Сумма договора</span><span class="kv-v">'+money(e.total)+'</span></div>'+
      '<div><span class="kv-k">Платёж в месяц</span><span class="kv-v">'+money(e.mo)+'</span></div>';
  };
  ['kPrice','kDown','kTerm','kMarkup','kPaid'].forEach(function(id){
    $('#'+id).addEventListener('input',preview);
    $('#'+id).addEventListener('change',preview);
  });
  $('#kTerm').addEventListener('change',function(){
    if(CFG.markup[this.value])$('#kMarkup').value=CFG.markup[this.value];
    preview();
  });
  preview();

  $('#kSave').addEventListener('click',function(){
    var d=collect();
    if(!d.name){toast('Укажите клиента');$('#kName').focus();return}
    if(d.price<=0){toast('Укажите стоимость товара');$('#kPrice').focus();return}
    if(d.paid>d.term){toast('Оплачено платежей больше, чем срок договора');return}
    this.disabled=true;
    var btn=this;
    Store.saveContract(d,function(err){
      btn.disabled=false;
      if(err){toast(err);return}
      if(!SRV.on){
        var e=enrich(d);
        if(!e.id)e.id='ДГ-'+dateToIso(TODAY).slice(2,7).replace('-','')+'-'+('00'+(CONTRACTS.length+1)).slice(-3);
        var k=CONTRACTS.map(function(x){return x.id}).indexOf(e.id);
        if(k>=0)CONTRACTS[k]=e;else CONTRACTS.push(e);
      }
      drawerClose();render();toast(d.id?'Договор сохранён':'Договор создан');
    });
  });
  var del=$('#kDel');
  if(del)del.addEventListener('click',function(){
    if(!confirm('Удалить договор '+c.id+'? Отменить будет нельзя.'))return;
    Store.delContract(c.id,function(err){
      if(err){toast(err);return}
      drawerClose();render();toast('Договор удалён');
    });
  });
}

/* ============ СТРАНИЦА: ПОЛЬЗОВАТЕЛИ ============ */
var USERLIST=null;
function pgUsers(){
  var me=SRV.user||{};
  var owner=me.role==='owner';
  var rows=USERLIST===null
    ? '<div class="empty">Загружаю…</div>'
    : (!USERLIST.length ? '<div class="empty">Пока нет ни одной учётной записи</div>' :
      '<div class="tbl-scroll"><table class="tbl"><thead><tr>'+
      '<th>Сотрудник</th><th>Логин</th><th>Права</th><th></th></tr></thead><tbody>'+
      USERLIST.map(function(u){
        var isMe=u.login===me.login;
        return '<tr style="cursor:default">'+
          '<td><div class="who"><span class="av">'+esc(ini(u.name))+'</span>'+
          '<span><span class="who-n">'+esc(u.name)+(isMe?' — это вы':'')+'</span></span></div></td>'+
          '<td class="n">'+esc(u.login)+'</td>'+
          '<td><span class="chip '+(u.role==='owner'?'ok':'neut')+'">'+
            (u.role==='owner'?'владелец':'сотрудник')+'</span></td>'+
          '<td class="r">'+((owner&&!isMe)?'<button class="filt" data-deluser="'+esc(u.login)+'">Удалить</button>':'')+'</td>'+
        '</tr>';
      }).join('')+'</tbody></table></div>');

  var addForm=owner?card('Добавить сотрудника',
    '<div class="fset">'+
      '<div class="fw"><label>Имя и фамилия</label><input class="ai" id="nuName" placeholder="Имя Фамилия"></div>'+
      '<div class="fw"><label>Логин</label><input class="ai" id="nuLogin" placeholder="латиница, цифры"></div>'+
      '<div class="fw"><label>Пароль</label><input class="ai" id="nuPw" type="password" placeholder="минимум 8 символов"></div>'+
      '<div class="fw"><label>Права</label><select class="ai" id="nuRole">'+
        '<option value="staff">Сотрудник — CRM и контент</option>'+
        '<option value="owner">Владелец — плюс управление доступом</option>'+
      '</select></div>'+
      '<div class="fw full"><button class="btn" id="nuAdd"><span>Создать учётную запись</span></button>'+
      '<div class="hint">Пароль задаёте вы и передаёте сотруднику лично. Он сможет сменить его сам.</div></div>'+
    '</div>','только владелец'):'';

  var pwForm=card('Сменить свой пароль',
    '<div class="fset">'+
      '<div class="fw"><label>Текущий пароль</label><input class="ai" id="pwCur" type="password"></div>'+
      '<div class="fw"><label>Новый пароль</label><input class="ai" id="pwNew" type="password" placeholder="минимум 8 символов"></div>'+
      '<div class="fw full"><button class="btn btn-ghost" id="pwGo"><span>Сменить пароль</span></button></div>'+
    '</div>',esc(me.name||''));

  var note=SRV.on?'':'<div class="warnbox" style="margin-bottom:4px">Сервер недоступен: '+
    'учётные записи не работают в автономном режиме.</div>';

  return note+card('Кто имеет доступ',rows,USERLIST?USERLIST.length+' чел.':'',false)+
    '<div class="grid-2b">'+addForm+pwForm+'</div>';
}
function bindUsers(){
  if(USERLIST===null){
    Store.loadUsers(function(list,err){
      USERLIST=err?[]:list;
      if(state.page==='users')render();
    });
  }
  $$('[data-deluser]').forEach(function(b){
    b.addEventListener('click',function(){
      var l=b.dataset.deluser;
      if(!confirm('Удалить учётную запись «'+l+'»? Доступ пропадёт сразу.'))return;
      Store.delUser(l,function(list,err){
        if(err){toast(err);return}
        USERLIST=list;render();toast('Учётная запись удалена');
      });
    });
  });
  var add=$('#nuAdd');
  if(add)add.addEventListener('click',function(){
    var u={login:($('#nuLogin').value||'').trim().toLowerCase(),
           name:($('#nuName').value||'').trim(),
           password:$('#nuPw').value,role:$('#nuRole').value};
    if(!/^[a-z0-9_.-]{3,32}$/.test(u.login)){toast('Логин: 3–32 символа, латиница и цифры');return}
    if(!u.name){toast('Укажите имя и фамилию');return}
    if(u.password.length<8){toast('Пароль должен быть не короче 8 символов');return}
    add.disabled=true;
    Store.addUser(u,function(list,err){
      add.disabled=false;
      if(err){toast(err);return}
      USERLIST=list;render();toast('Учётная запись «'+u.login+'» создана');
    });
  });
  var pg=$('#pwGo');
  if(pg)pg.addEventListener('click',function(){
    var cur=$('#pwCur').value,nx=$('#pwNew').value;
    if(nx.length<8){toast('Новый пароль должен быть не короче 8 символов');return}
    if(!SRV.on){toast('Смена пароля работает только на сервере');return}
    pg.disabled=true;
    Store.changePassword(cur,nx,function(err){
      pg.disabled=false;
      if(err){toast(err);return}
      $('#pwCur').value='';$('#pwNew').value='';
      toast('Пароль изменён');
    });
  });
}

/* ============ СТРАНИЦА: УВЕДОМЛЕНИЯ ============ */
var NOTIFY=null;
function pgNotify(){
  var owner=(SRV.user||{}).role==='owner';
  if(!SRV.on)return card('Уведомления',emptyBlock('Сервер недоступен',
    'Уведомления настраиваются на боевом сервере.'),'',false);
  if(NOTIFY===null)return card('Уведомления','<div class="empty">Загружаю…</div>','',false);
  var n=NOTIFY;
  var chk=function(id,on,label){
    return '<label class="swi"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+
      (owner?'':' disabled')+'><span class="swi-b"></span><span>'+esc(label)+'</span></label>';
  };
  var mail=card('Письмо на почту',
    chk('nEmailOn',n.email.on,'Присылать письмо при каждой новой заявке')+
    '<div class="fset" style="margin-top:16px">'+
      '<div class="fw full"><label>Кому присылать</label>'+
      '<input class="ai" id="nEmailTo" value="'+esc(n.email.to||'')+'" placeholder="zaur@zkfinance.ru, manager@zkfinance.ru"'+(owner?'':' disabled')+'>'+
      '<div class="hint">Можно несколько адресов через запятую.</div></div>'+
      '<div class="fw full"><label>От кого (обратный адрес)</label>'+
      '<input class="ai" id="nEmailFrom" value="'+esc(n.email.from||'')+'" placeholder="noreply@zkfinance.ru"'+(owner?'':' disabled')+'>'+
      '<div class="hint"><b>Важно:</b> заведите этот ящик в панели Timeweb на своём домене. '+
      'Письма от адреса на чужом домене почтовые службы отправляют в спам.</div></div>'+
    '</div>','почта');
  var hook=card('Вебхук',
    chk('nHookOn',n.webhook.on,'Отправлять данные заявки на внешний адрес')+
    '<div class="fset" style="margin-top:16px">'+
      '<div class="fw full"><label>Адрес</label>'+
      '<input class="ai" id="nHookUrl" value="'+esc(n.webhook.url||'')+'" placeholder="https://..."'+(owner?'':' disabled')+'>'+
      '<div class="hint">POST с JSON: поля <b>event</b>, <b>lead</b>, <b>text</b>, <b>url</b>. '+
      'Так заявку можно передать в любую систему — от Битрикс24 до собственного скрипта.</div></div>'+
    '</div>','интеграция');
  var warn='<div class="warnbox" style="margin-bottom:4px"><b>Telegram напрямую не работает.</b> '+
    'Проверил с вашего сервера: соединение с api.telegram.org не устанавливается — сервер в России, '+
    'сервис заблокирован. Яндекс, VK и другие адреса при этом доступны. '+
    'Если нужен именно Telegram, поставьте вебхук на любой шлюз вне России, который перешлёт сообщение боту.</div>';
  var bar='<div class="adm-bar" style="border-radius:var(--r-lg);border:1px solid var(--rule);margin-top:4px">'+
    (owner?'<button class="btn" id="nSave"><span>Сохранить</span></button>':'')+
    '<button class="btn btn-ghost" id="nTest"><span>Отправить тестовое</span></button>'+
    '<span class="io-note" style="margin-left:auto">'+
    (owner?'Настройки меняет владелец.':'Менять настройки может только владелец. Проверку может запустить любой.')+
    '</span></div>';
  return warn+'<div class="grid-2b">'+mail+hook+'</div>'+bar;

function bindNotify(){
  if(NOTIFY===null&&SRV.on){
    Store.loadNotify(function(cfg,err){
      NOTIFY=err?{email:{on:false,to:'',from:''},webhook:{on:false,url:''}}:cfg;
      if(state.page==='notify')render();
    });
    return;
  }
  var save=$('#nSave');
  if(save)save.addEventListener('click',function(){
    var cfg={email:{on:$('#nEmailOn').checked,to:$('#nEmailTo').value.trim(),from:$('#nEmailFrom').value.trim()},
             webhook:{on:$('#nHookOn').checked,url:$('#nHookUrl').value.trim()}};
    save.disabled=true;
    Store.saveNotify(cfg,function(err){
      save.disabled=false;
      if(err){toast(err);return}
      NOTIFY=cfg;toast('Настройки сохранены');
    });
  });
  var t=$('#nTest');
  if(t)t.addEventListener('click',function(){
    t.disabled=true;t.querySelector('span').textContent='Отправляю…';
    Store.testNotify(function(res,err){
      t.disabled=false;t.querySelector('span').textContent='Отправить тестовое';
      toast(err?err:('Проверка — '+res));
    });
  });
}

/* ============ ОТРИСОВКА ХАБА ============ */
function renderRail(){
  var n=$('#railNav');n.innerHTML='';
  PAGES.forEach(function(p){
    if(p.g){n.appendChild(el('div','rail-sec',esc(p.g)));return}
    var b=el('button','rl'+(state.page===p.id?' on':''));
    b.type='button';
    var cnt=null,warn=false;
    if(p.id==='deals')cnt=state.deals.filter(function(d){return d.stage==='new'}).length||inWork();
    if(p.id==='clients')cnt=clientsFromContracts().length;
    if(p.id==='contracts')cnt=CONTRACTS.length;
    if(p.id==='payments'){cnt=overdueCount();warn=cnt>0;if(!cnt)cnt=activeCount()}
    if(p.id==='shariah')cnt=state.deals.filter(function(d){return d.stage==='shariah'}).length;
    if(p.id==='users')cnt=(USERLIST||[]).length||null;
    var badge=cnt?'<span class="rl-badge'+(warn?' warn':'')+'">'+cnt+'</span>':'';
    b.innerHTML=ico(p.ic)+'<span>'+esc(p.t)+'</span>'+badge;
    b.addEventListener('click',function(){
      location.hash='#'+p.id;$('#rail').classList.remove('open');
    });
    n.appendChild(b);
  });
  if(state.user){
    $('#meName').textContent=state.user.name;
    $('#meRole').textContent=state.user.role;
    $('#meAv').textContent=ini(state.user.name);
  }
  $('#tbDate').textContent='4 сентября 2026';
}
var RENDERERS={dash:pgDash,deals:pgDeals,clients:pgClients,contracts:pgContracts,
  payments:pgPayments,shariah:pgShariah,analytics:pgAnalytics,settings:pgSettings,
  content:pgContent,users:pgUsers,notify:pgNotify};
function render(){
  var p=PAGES.filter(function(x){return x.id===state.page})[0]||PAGES[1];
  $('#tbTitle').textContent=p.t;$('#tbCrumb').textContent=p.crumb;
  CHARTS=[];
  $('#hubBody').innerHTML=(RENDERERS[state.page]||pgDash)();
  drawCharts();
  renderRail();
  var searchBox=$('.tb-search');
  if(searchBox)searchBox.style.display=(state.page==='content')?'none':'';
  if(state.page==='content'){bindContent();return}
  if(state.page==='users'){bindUsers();return}
  if(state.page==='notify'){bindNotify();return}
  if(state.page==='deals')bindDeals();
  $$('[data-ct]').forEach(function(tr){
    tr.addEventListener('click',function(e){
      if(e.target.closest('[data-pay]'))return;
      openContract(tr.dataset.ct);
    });
  });
  $$('.pay-btn').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var c=CONTRACTS.filter(function(o){return o.id===b.dataset.pay})[0];
      if(!c)return;
      b.disabled=true;
      acceptPayment(c,function(err){
        b.disabled=false;
        if(err){toast(err);return}
        render();toast('Платёж по '+c.id+' принят');
      });
    });
  });
  $$('[data-lead]').forEach(function(e){
    e.addEventListener('click',function(){openDeal(e.dataset.lead)});
  });
  $$('.new-contract').forEach(function(b){
    b.addEventListener('click',function(){contractForm(null)});
  });
  $$('[data-cl]').forEach(function(tr){
    tr.addEventListener('click',function(){openClient(tr.dataset.cl)});
  });
  if(state.page==='shariah'){
    $$('#hubBody tr[data-id]').forEach(function(tr){
      tr.addEventListener('click',function(){openDeal(tr.dataset.id)});
    });
  }
  $$('[data-mk]').forEach(function(b){
    b.addEventListener('click',function(){
      var t=b.dataset.mk,dir=+b.dataset.dir;
      CFG.markup[t]=Math.max(3,Math.min(60,CFG.markup[t]+dir));
      persist();siteStale=true;render();
      toast('Наценка на '+t+' мес: '+CFG.markup[t]+'%');
    });
  });
  $$('[data-set]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.set,dir=+b.dataset.dir;
      if(k==='down')CFG.minDown=Math.max(0,Math.min(60,CFG.minDown+dir*5));
      if(k==='pen')CFG.penalty=Math.max(0,CFG.penalty+dir*500);
      persist();siteStale=true;render();
    });
  });
}

/* ============ РОУТЕР ПАНЕЛИ ============ */
function showView(v){
  $('#gate').hidden=v!=='gate';
  $('#hub').hidden=v!=='hub';
  document.body.style.overflowY=v==='gate'?'hidden':'';
}
function route(){
  if(!state.user){
    var want=(location.hash||'').replace(/^#\/?/,'');
    if(want)pendingHub='#'+want;
    showView('gate');gateInit();return;
  }
  var pg=(location.hash||'').replace(/^#\/?/,'')||'dash';
  if(!PAGES.filter(function(p){return p.id===pg}).length)pg='dash';
  state.page=pg;showView('hub');render();
}
/* ============ ЗАПУСК ============ */
function init(){
  importInit();contentDelegates();findInit();
  $('#scrim').addEventListener('click',drawerClose);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!$('#drawer').hidden)drawerClose();
  });
  var s=$('#hubSearch');
  s.addEventListener('input',function(){state.q=s.value;render()});
  $('#hubMenu').addEventListener('click',function(){$('#rail').classList.toggle('open')});
  $('#railExit').addEventListener('click',function(){
    if(state.dirty&&!confirm('Есть несохранённые правки контента. Выйти и потерять их?'))return;
    if(SRV.on)Store.logout(function(){state.user=null;state.dirty=false;location.hash='';route()});
    else{state.user=null;location.hash='';route()}
  });
  window.addEventListener('hashchange',route);
  window.addEventListener('beforeunload',function(e){
    if(state.dirty){e.preventDefault();e.returnValue=''}
  });
  var rt;
  window.addEventListener('resize',function(){
    clearTimeout(rt);rt=setTimeout(drawCharts,150);
  });
  Store.probe(function(){
    Store.loadContent(function(){
      var go=function(){
        route();
        if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCharts);
      };
      // сессия могла остаться от прошлого визита — тогда данные грузим сразу
      if(SRV.authed)Store.loadContracts(function(){Store.loadLeads(go)});
      else go();
    });
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
else init();
})();
</script>
